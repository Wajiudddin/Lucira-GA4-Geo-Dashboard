name: Deploy Dashboard to Pages

# Publishes dashboard/ga4-geo-intelligence-dashboard.html (+ its two bundled
# static data files) to GitHub Pages at the repo root. Static snapshot only —
# no live API keys or credentials embedded.
#
# One-time setup required before this can go live: repo Settings → Pages →
# "Build and deployment" → Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble Pages site
        run: |
          set -euo pipefail
          mkdir -p _site
          touch _site/.nojekyll
          cp dashboard/ga4-geo-intelligence-dashboard.html _site/index.html
          cp dashboard/geo_intel_data.js _site/geo_intel_data.js
          cp dashboard/caratlane_intel_data.js _site/caratlane_intel_data.js
          grep -q "Geo Intelligence" _site/index.html || { echo "::error::dashboard content missing"; exit 1; }

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

/* ═══════════════════════════════════════════════════════════════════════
   LUCIRA WALK-IN SOURCE INTELLIGENCE — premium jewellery command center
   Two themes (dark/light) via [data-theme] on <html>. Palette per the
   dataviz skill: fixed-order categorical slots for the 5 channels, status
   colors reserved for alerts, sequential blue for magnitude/heat shading.
   ═══════════════════════════════════════════════════════════════════════ */
:root{
  /* LUCIRA BRAND (Brand Guidelines & Narratives): Earthy Taupe #A68380, Warm Cream #F2DFCE, Blush Pink #F2DCE0, Muted Rose #D9A7B4;
     secondaries Rose Gold #B76E79, Metallic Gold #D4AF37, Deep Slate Blue #3D405B, Sapphire #0D4F8B, Emerald #1B4D3E.
     --gold* names kept for code compatibility; they now carry the brand taupe/rose accent. */
  --brand-taupe:#A68380; --brand-cream:#F2DFCE; --brand-blush:#F2DCE0; --brand-rose:#D9A7B4; --brand-rosegold:#B76E79;
  --gold:#8E6763; --gold-2:#D9A7B4; --gold-deep:#7A5754; --gold-soft:rgba(166,131,128,.14); --on-accent:#FFF8F0;
  --good:#0ca30c; --warn:#fab219; --crit:#d03b3b; --info:#4d96ff;
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --shadow:0 18px 50px -20px rgba(0,0,0,.65);
  --ease:cubic-bezier(.22,.61,.36,1);
  --serif:"Josefin Sans","Futura","Jost",system-ui,sans-serif;
  --sans:"Futura","Jost",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  /* categorical: fixed order Zoho Deals > Zoho Leads > Shopify > WebEngage > Direct Walkin (channel priority) */
  --series-1:#0D4F8B; --series-2:#B76E79; --series-3:#2E7D5E; --series-4:#C9A227; --series-5:#3D405B;
}
html[data-theme=dark]{
  --bg:#1E1718; --bg-2:#241C1D; --surface:#2B2223; --surface-2:#33292A; --surface-3:#3D3233;
  --glass:rgba(48,38,39,.66); --glass-brd:rgba(217,167,180,.20); --hair:rgba(242,223,206,.09);
  --ink:#F7EDE4; --ink-2:#CDB9B2; --muted:#998682;
  --gold:#D9A7B4; --gold-2:#F2DCE0; --gold-deep:#A68380; --gold-soft:rgba(217,167,180,.14); --on-accent:#2B1F20;
  --hero-grad:linear-gradient(135deg,rgba(217,167,180,.14),rgba(166,131,128,.08)); --grid:rgba(255,255,255,.06); --axis:rgba(255,255,255,.14);
  --sheen:radial-gradient(120% 120% at 0% 0%,rgba(217,167,180,.10),transparent 46%),radial-gradient(120% 120% at 100% 0%,rgba(242,223,206,.05),transparent 50%);
  --card-grad:linear-gradient(158deg,rgba(255,255,255,.045),rgba(255,255,255,.008));
  --good:#0ca30c; --warn:#fab219; --crit:#e66767;
  --series-1:#6A9FD8; --series-2:#D98C98; --series-3:#4FAE88; --series-4:#D4AF37; --series-5:#A3A6C8;
}
html[data-theme=light]{
  --bg:#F6ECE6; --bg-2:#FBF5F1; --surface:#FFFCFA; --surface-2:#FBF3EF; --surface-3:#F2E3DC;
  --glass:rgba(255,252,250,.78); --glass-brd:rgba(166,131,128,.24); --hair:rgba(80,50,48,.10);
  --ink:#3A2B2C; --ink-2:#6B5754; --muted:#9A8783; --grid:rgba(80,50,48,.08); --axis:rgba(80,50,48,.22);
  --sheen:radial-gradient(120% 120% at 0% 0%,rgba(242,220,224,.85),transparent 46%),radial-gradient(120% 120% at 100% 0%,rgba(242,223,206,.75),transparent 50%);
  --card-grad:linear-gradient(158deg,rgba(255,255,255,.92),rgba(251,243,239,.6));
  --shadow:0 18px 44px -22px rgba(110,70,66,.22);
  --hero-grad:linear-gradient(135deg,rgba(242,220,224,.55),rgba(242,223,206,.45));
  --good:#0ca30c; --warn:#fab219; --crit:#d03b3b;
  --series-1:#0D4F8B; --series-2:#B76E79; --series-3:#2E7D5E; --series-4:#C9A227; --series-5:#3D405B;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--sans); background:var(--bg); color:var(--ink);
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
  background-image:var(--sheen); background-attachment:fixed; overflow-x:hidden;
}
::selection{background:var(--gold-soft);color:var(--ink)}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;letter-spacing:.2px;line-height:1.15}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:20px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--gold-deep);background-clip:content-box}

#loader{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:26px;transition:opacity .7s var(--ease),visibility .7s}
#loader.done{opacity:0;visibility:hidden}
.load-mark{width:100px;height:100px;position:relative;display:grid;place-items:center}
.load-mark svg{width:100%;height:100%}
.load-ring{position:absolute;inset:-14px;border-radius:50%;border:1.5px solid var(--glass-brd);border-top-color:var(--gold);animation:spin 1.15s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.load-word{font-family:var(--serif);font-size:30px;letter-spacing:6px;color:var(--brand-taupe);text-transform:uppercase;padding-left:6px}
.load-sub{font-size:11px;letter-spacing:4px;color:var(--muted);text-transform:uppercase;text-align:center;margin-top:4px}
.load-bar{width:180px;height:2px;background:var(--hair);border-radius:2px;overflow:hidden}
.load-bar i{display:block;height:100%;width:40%;background:linear-gradient(90deg,transparent,var(--gold),transparent);animation:load 1.1s var(--ease) infinite}
@keyframes load{0%{transform:translateX(-120%)}100%{transform:translateX(320%)}}

.brand{display:flex;align-items:center;gap:12px}
.brand .mono{width:36px;height:36px;border-radius:11px;flex:0 0 auto;background:linear-gradient(150deg,#1c1c22,#0c0c0e);border:1px solid var(--glass-brd);display:grid;place-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.brand .mono svg{width:22px;height:22px}
.brand .wm{display:flex;flex-direction:column;line-height:1}
.brand .wm b{font-family:var(--serif);font-size:18px;font-weight:600;letter-spacing:3px;background:linear-gradient(100deg,var(--gold-2),var(--gold-deep));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand .wm span{font-size:8px;letter-spacing:3px;text-transform:uppercase;margin-top:3px;font-weight:600;color:var(--muted)}

#app{opacity:0;transition:opacity .6s var(--ease)}
#app.ready{opacity:1}
header.top{position:relative;z-index:60;background:var(--brand-taupe);border-bottom:1px solid rgba(0,0,0,.08);color:var(--brand-cream);padding:11px clamp(14px,3vw,30px);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top .spacer{flex:1}
.brand .logo{height:40px;width:auto;display:block}
.brand .bdiv{width:1px;height:30px;background:rgba(242,223,206,.45)}
.brand .wm span{color:var(--brand-cream)!important;font-size:10px!important;letter-spacing:3px;margin:0!important}
header.top .src-dot,header.top .fresh,header.top .iconbtn{background:rgba(255,248,240,.16);border-color:rgba(242,223,206,.35);color:var(--brand-cream)}
header.top .iconbtn:hover{color:#fff;border-color:var(--brand-cream)}
header.top .btn.gold{background:var(--brand-cream);color:#6E4F4C;box-shadow:none}
.src-dot{display:inline-flex;align-items:center;gap:7px;font-size:11px;color:var(--ink-2);padding:5px 11px;border:1px solid var(--hair);border-radius:20px;background:var(--surface-2)}
.src-dot i{width:7px;height:7px;border-radius:50%;background:var(--warn);box-shadow:0 0 8px var(--warn)}
.src-dot.live i{background:var(--good);box-shadow:0 0 8px var(--good)}
.fresh{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);padding:5px 11px;border:1px solid var(--hair);border-radius:20px;background:var(--surface-2)}
.iconbtn{width:36px;height:36px;border-radius:11px;border:1px solid var(--hair);background:var(--surface-2);display:grid;place-items:center;color:var(--ink-2);transition:.2s var(--ease);font-size:15px}
.iconbtn:hover{color:var(--gold);border-color:var(--glass-brd);transform:translateY(-1px)}
.btn{padding:8px 15px;border-radius:11px;border:1px solid var(--hair);background:var(--surface-2);color:var(--ink);font-size:12.5px;font-weight:500;display:inline-flex;align-items:center;gap:7px;transition:.2s var(--ease)}
.btn:hover{border-color:var(--glass-brd);transform:translateY(-1px)}
.btn.gold{background:linear-gradient(120deg,var(--gold),var(--gold-deep));color:var(--on-accent);border:none;font-weight:600;box-shadow:0 8px 20px -8px var(--gold-deep)}

nav.tabs{position:relative;z-index:55;display:flex;gap:3px;overflow-x:auto;scrollbar-width:none;padding:9px clamp(14px,3vw,30px);backdrop-filter:blur(18px);background:linear-gradient(180deg,var(--glass),transparent);border-bottom:1px solid var(--hair)}
nav.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 15px;border-radius:10px;font-size:12.5px;font-weight:500;color:var(--ink-2);white-space:nowrap;display:inline-flex;align-items:center;gap:7px;transition:.18s var(--ease);border:1px solid transparent}
.tab:hover{color:var(--ink);background:var(--surface-2)}
.tab.active{color:var(--gold);background:var(--gold-soft);border-color:var(--glass-brd)}


.fbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 12px;align-items:end;margin:0 0 18px;padding:12px 14px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--glass-brd)}
.fbar .fld label{font-size:10px}
.cbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:-4px 0 14px}.cbar label{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:600}.cbar select.inp{width:auto}.cbar input.inp{width:150px}.cbar span{color:var(--muted)}.cbar b{color:var(--ink)}
.pbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 14px}
.pseg{display:inline-flex;gap:2px;padding:4px;border-radius:12px;background:var(--surface);border:1px solid var(--glass-brd);box-shadow:var(--shadow);overflow-x:auto;max-width:100%}
.pbtn{padding:7px 14px;border-radius:9px;font-size:12.5px;font-weight:500;color:var(--ink-2);white-space:nowrap;transition:.15s var(--ease)}
.pbtn:hover{color:var(--ink);background:var(--surface-2)}
.pbtn.on{background:var(--brand-taupe);color:#FFF8F0;font-weight:600}
.pcust{display:inline-flex;align-items:center;gap:8px}.pcust .inp{width:150px}.pcust span{color:var(--muted)}
.prange{font-size:11.5px;color:var(--muted)}
main{padding:clamp(16px,3vw,30px);max-width:1560px;margin:0 auto}
.view{display:none;animation:fade .5s var(--ease)}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin:6px 0 16px}
.sec-head h2{font-size:clamp(20px,2.4vw,27px)}
.sec-head .sub{color:var(--muted);font-size:12.5px;margin-top:3px}
.eyebrow{font-size:10.5px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);font-weight:600}

.card{background:var(--card-grad),var(--glass);border:1px solid var(--glass-brd);border-radius:var(--r-lg);backdrop-filter:blur(14px);box-shadow:var(--shadow);position:relative;overflow:hidden}
.card>.pad{padding:18px}
.card .ct{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.card .ct h3{font-size:15.5px;letter-spacing:.3px}
.card .ct .ct-r{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.card .ct .hint{font-size:11px;color:var(--muted)}
.grid{display:grid;gap:16px}
.g-2{grid-template-columns:repeat(2,1fr)}.g-3{grid-template-columns:repeat(3,1fr)}
.g-4{grid-template-columns:repeat(4,1fr)}.g-7{grid-template-columns:repeat(7,1fr)}
@media(max-width:1180px){.g-4,.g-7{grid-template-columns:repeat(3,1fr)}.g-3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){.g-2,.g-3,.g-4,.g-7{grid-template-columns:1fr}}

.kpi{background:var(--card-grad),var(--glass);border:1px solid var(--glass-brd);border-radius:var(--r-md);padding:14px 15px 12px;position:relative;overflow:hidden;transition:.25s var(--ease);cursor:default}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gold);opacity:.75}
.kpi:hover{transform:translateY(-3px);box-shadow:0 22px 44px -24px rgba(0,0,0,.7)}
.kpi.pos::before{background:var(--good)}.kpi.neg::before{background:var(--crit)}.kpi.neu::before{background:var(--muted)}
.kpi .lab{font-size:10.5px;color:var(--ink-2);letter-spacing:.4px;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.kpi .val{font-family:var(--serif);font-size:24px;font-weight:600;margin:5px 0 2px;letter-spacing:.3px;line-height:1}
.kpi .row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px}
.kpi .delta{font-size:11px;font-weight:600;display:inline-flex;align-items:center;gap:3px}
.kpi .delta.up{color:var(--good)}.kpi .delta.down{color:var(--crit)}.kpi .delta.flat{color:var(--muted)}
.kpi .sub2{font-size:10.5px;color:var(--muted)}
.kpi .ai{margin-top:8px;font-size:10.6px;color:var(--ink-2);border-top:1px dashed var(--hair);padding-top:7px;display:flex;gap:6px;line-height:1.4}
.kpi .ai b{color:var(--gold);font-weight:600}
.kpi{position:relative}
.kpi>.info-btn{position:absolute;top:10px;right:10px}

.pill{font-size:10.5px;padding:3px 9px;border-radius:20px;border:1px solid var(--hair);background:var(--surface-2);color:var(--ink-2);white-space:nowrap;display:inline-block}
.pill.g{color:var(--gold);border-color:var(--glass-brd);background:var(--gold-soft)}
.pill.ok{color:var(--good);border-color:rgba(12,163,12,.3);background:rgba(12,163,12,.1)}
.pill.bad{color:var(--crit);border-color:rgba(208,59,59,.3);background:rgba(208,59,59,.1)}
.pill.warn{color:var(--warn);border-color:rgba(250,178,25,.35);background:rgba(250,178,25,.12)}
select.inp,input.inp{background:var(--surface-2);border:1px solid var(--hair);border-radius:9px;color:var(--ink);padding:7px 10px;font-size:12px;outline:none;transition:.15s;width:100%}
select.inp:focus,input.inp:focus{border-color:var(--gold)}

table.dt{width:100%;border-collapse:collapse;font-size:12.5px}
table.dt th{text-align:left;padding:9px 11px;color:var(--muted);font-weight:600;font-size:10.8px;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--hair);cursor:pointer;white-space:nowrap;position:sticky;top:0;background:var(--surface)}
table.dt th.num,table.dt td.num{text-align:right;font-variant-numeric:tabular-nums}
table.dt td{padding:9px 11px;border-bottom:1px solid var(--hair)}
table.dt tbody tr:hover{background:var(--surface-2)}
table.dt tbody tr.row-selected{background:rgba(12,163,12,.16);box-shadow:inset 3px 0 0 var(--good)}
table.dt tbody tr.row-selected:hover{background:rgba(12,163,12,.22)}
table.dt th:hover{color:var(--ink-2)}
.cmenu-btn{width:26px;height:26px;border-radius:8px;border:1px solid var(--hair);background:var(--surface-2);color:var(--ink-2);font-size:17px;line-height:1;display:grid;place-items:center;cursor:pointer;transition:.15s}
.cmenu-btn:hover{color:var(--gold);border-color:var(--glass-brd)}
.cmenu{position:fixed;z-index:200;background:var(--surface);border:1px solid var(--glass-brd);border-radius:12px;box-shadow:var(--shadow);padding:6px;min-width:190px;display:none}
.cmenu.on{display:block}
.cmenu button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:9px 11px;border-radius:8px;background:none;border:none;color:var(--ink);font-size:12.5px;font-weight:500;cursor:pointer}
.cmenu button:hover{background:var(--surface-2);color:var(--gold)}
.rank{width:22px;height:22px;border-radius:7px;display:inline-grid;place-items:center;font-size:10.5px;font-weight:700;background:var(--surface-3);color:var(--ink-2)}

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════════
   LUCIRA WALK-IN SOURCE INTELLIGENCE — engine
   Single source of truth = window.WALKIN_SOURCE_DATA (reporting_tables:
   ds_imputed_reporting.customer_master_source / walkin_channel_final).
   Channel priority (already resolved per row, client-set 2026-07-28):
   Zoho Deals > Zoho Leads > Shopify > WebEngage > Direct Walkin. All aggregation is
   client-side from the flat items[] array — no server-side pre-aggregation.
   ═══════════════════════════════════════════════════════════════════════ */
const CONFIG = {
  SNAPSHOT_URL: "https://storage.googleapis.com/lucira-dashboards/walkin-source/latest.json", // LIVE — walkin-source-api Cloud Run fn refreshes this daily at 10:00 IST
  API_BASE: ""
};
// channel priority (client change, 2026-07-28): Zoho Deals > Zoho Leads > Shopify > WebEngage > Direct Walkin
const CHANNELS = ["Zoho Deals","Zoho Leads","Shopify","WebEngage","Direct Walkin"];
const CHANNEL_COLOR = {"Zoho Deals":"var(--series-1)","Zoho Leads":"var(--series-2)",Shopify:"var(--series-3)","WebEngage":"var(--series-4)","Direct Walkin":"var(--series-5)"};
const CHANNEL_HEX = {}; // resolved at runtime from CSS custom properties (theme-aware)
function resolveChannelHex(){ const s=getComputedStyle(document.body);
  CHANNELS.forEach((c,i)=>{ CHANNEL_HEX[c]=s.getPropertyValue('--series-'+(i+1)).trim(); }); }

const STATE = {
  raw:null, items:[], orders:[], hasOrders:false, coverage:null, meta:null, source:'sample',
  filters:{ range:'30d', from:null, to:null, store:'', city:'', state:'', region:'', channel:'', organic:'', ctype:'' },
  compare:false, tab:'daily', monthWin:'6', lineSel:{walkin:null, orders:null}
};

/* ── generic helpers ─────────────────────────────────────────── */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtInt(n){ return (n==null||isNaN(n))?'—':Math.round(n).toLocaleString('en-IN'); }
function pctStr(x,dp){ return (x==null||isNaN(x)||!isFinite(x))?'—':x.toFixed(dp==null?1:dp)+'%'; }
function pct(a,b){ return b?(100*a/b):0; }
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parseYmd(s){ if(!s)return null; const p=s.split('-').map(Number); return new Date(p[0],p[1]-1,p[2]); }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function monthStart(d){ return new Date(d.getFullYear(),d.getMonth(),1); }
function quarterStart(d){ return new Date(d.getFullYear(),Math.floor(d.getMonth()/3)*3,1); }
function yearStart(d){ return new Date(d.getFullYear(),0,1); }
function weekStartMon(d){ const x=new Date(d); const dow=(x.getDay()+6)%7; return addDays(x,-dow); }
function monthKey(s){ return s.slice(0,7); }
function weekKey(s){ return ymd(weekStartMon(parseYmd(s))); }
function diffDaysStr(a,b){ return Math.round((parseYmd(a)-parseYmd(b))/86400000); }
function trunc(s,n){ s=String(s||''); return s.length>n?s.slice(0,n-1)+'…':s; }
function growth(cur,prev){ if(prev===0||prev==null) return cur>0?100:0; return (cur-prev)/Math.abs(prev)*100; }
function sortDesc(arr,key){ return [...arr].sort((a,b)=>b[key]-a[key]); }
function sortAsc(arr,key){ return [...arr].sort((a,b)=>a[key]-b[key]); }
function downloadBlob(content,filename,mime){ if(mime==='text/csv' && typeof content==='string' && content.charCodeAt(0)!==0xFEFF) content='﻿'+content;
  const blob=new Blob([content],{type:mime+';charset=utf-8'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename;
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},800); }
function csvOf(rows){ return rows.map(r=>r.map(v=>{ v=(v==null?'':''+v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }).join(',')).join('\n'); }
function xlsOf(rows){ const cell=v=>{ v=(v==null?'':''+v); const num=/^-?[\d.]+$/.test(v.replace(/,/g,'')); return `<Cell><Data ss:Type="${num?'Number':'String'}">${esc(num?v.replace(/,/g,''):v)}</Data></Cell>`; };
  return `<?xml version="1.0"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet"><Worksheet ss:Name="Export"><Table>`+rows.map(r=>`<Row>${r.map(cell).join('')}</Row>`).join('')+`</Table></Worksheet></Workbook>`; }
function tableToRows(tblEl){ return [...tblEl.querySelectorAll('tr')].map(tr=>[...tr.children].map(c=>c.textContent.replace(/\s+/g,' ').trim())); }

/* ═══════════════════════════════════════════════════════════════════════
   LOAD  (snapshot fetch → embedded window.WALKIN_SOURCE_DATA fallback)
   ═══════════════════════════════════════════════════════════════════════ */
async function loadData(){
  const url = CONFIG.SNAPSHOT_URL || CONFIG.API_BASE;
  if(url){
    try{ const res=await fetch(url,{cache:'no-store'}); if(!res.ok) throw new Error('HTTP '+res.status);
      const j=await res.json(); if(!j || !j.items) throw new Error('malformed snapshot'); ingest(j,'live'); return;
    }catch(e){ console.warn('Snapshot load failed, using embedded data:',e.message); }
  }
  ingest(window.WALKIN_SOURCE_DATA,'sample');
}
function ingest(j,source){
  STATE.raw=j; STATE.items=(j.items||[]).slice(); STATE.coverage=j.coverage||{}; STATE.meta=j.meta||{}; STATE.source=source;
  STATE.orders=(j.orders||[]).slice(); STATE.hasOrders=Array.isArray(j.orders);
  STATE.minDate=STATE.coverage.min_visit_date; STATE.maxDate=STATE.coverage.max_visit_date;
}

/* ═══════════════════════════════════════════════════════════════════════
   DATE RANGES  (relative to STATE.maxDate — the latest date ACTUALLY in
   the data, never the browser's wall-clock date, per data-freshness note)
   ═══════════════════════════════════════════════════════════════════════ */
const RANGES=[['mrd','Most recent day'],['yest','Yesterday'],['today','Today'],['7d','Last 7 Days'],['week','This Week'],['30d','Last 30 Days'],['mtd','This Month'],['qtd','Quarter to date'],['ytd','Year to date'],['all','All time'],['custom','Custom range']];
function dateRange(range){
  const D=parseYmd(STATE.maxDate); const f=STATE.filters; let from,to=D;
  switch(range){
    case 'mrd': from=D; break;
    case 'yest': { const T=todayIST(); from=to=addDays(T,-1); break; }
    case 'today': from=to=todayIST(); break;
    case '7d': { const T=todayIST(); to=T; from=addDays(T,-6); break; }
    case 'week': { const T=todayIST(); to=T; from=weekStart(T); break; }
    case '30d': { const T=todayIST(); to=T; from=addDays(T,-29); break; }
    case 'mtd': { const T=todayIST(); to=T; from=monthStart(T); break; }
    case 'qtd': from=quarterStart(D); break;
    case 'ytd': from=yearStart(D); break;
    case 'all': from=parseYmd(STATE.minDate); break;
    case 'custom': from=parseYmd(f.from)||addDays(D,-29); to=parseYmd(f.to)||D; if(to>D)to=D; break;
    default: from=addDays(D,-29);
  }
  return {from:ymd(from),to:ymd(to)};
}
function shiftMonth(d,n){ const y=d.getFullYear(), m=d.getMonth()+n; const last=new Date(y,m+1,0).getDate(); return new Date(y,m,Math.min(d.getDate(),last)); }
const CMP_MODES=[['month','Same dates last month'],['prev','Previous period (same length)'],['custom','Custom dates']];
function comparePeriod(cur){ const f=STATE.filters, mode=f.cmp||'month';
  if(mode==='custom'&&f.cmpFrom&&f.cmpTo) return {from:f.cmpFrom,to:f.cmpTo};

/* ═══════════════════════════════════════════════════════════════════════
   FILTER PREDICATE + APPLY
   ═══════════════════════════════════════════════════════════════════════ */
function inWin(d,win){ return d>=win.from && d<=win.to; }
function passDim(it,F){
  if(F.store && it.store_name!==F.store) return false;
  if(F.city && (it.city||'Unknown') !== F.city) return false;
  if(F.state && (it.state||'Unknown') !== F.state) return false;
  if(F.region && (it.region||'Unknown') !== F.region) return false;
  if(F.channel && it.customer_channel!==F.channel) return false;
  if(F.organic==='organic' && it.customer_channel!=='Direct Walkin') return false;
  if(F.organic==='known' && it.customer_channel==='Direct Walkin') return false;
  if(F.ctype==='New' && it.customer_type!=='New') return false;
  if(F.ctype==='Repeat' && it.customer_type!=='Repeat') return false;
  if(F.ctype==='Returning' && !(it.lifetime_visits>1)) return false;
  return true;
}
function itemsInWindow(win,F){ F=F||STATE.filters; return STATE.items.filter(it=>inWin(it.visit_date,win) && passDim(it,F)); }
function itemsAllDates(F){ F=F||STATE.filters; return STATE.items.filter(it=>passDim(it,F)); }

/* ORDERS — snapshot orders[] = walkin_order_channel_final: marketing_sale STORE invoices, cancelled removed,
   one row per invoice, buyer mobile matched with the same channel priority as a walk-in */
function passDimOrder(o,F){
  if(F.store && o.store_name!==F.store) return false;
  if(F.city && (o.city||'Unknown') !== F.city) return false;
  if(F.state && (o.state||'Unknown') !== F.state) return false;
  if(F.region && (o.region||'Unknown') !== F.region) return false;
  if(F.channel && o.customer_channel!==F.channel) return false;
  if(F.organic==='organic' && o.customer_channel!=='Direct Walkin') return false;
  if(F.organic==='known' && o.customer_channel==='Direct Walkin') return false;
  return true; // Customer Type (New / Repeat visit) is a visit concept — not applied to orders
}
function ordersInWindow(win,F){ F=F||STATE.filters; return STATE.orders.filter(o=>inWin(o.order_date,win) && passDimOrder(o,F)); }
function ordersAllDates(F){ F=F||STATE.filters; return STATE.orders.filter(o=>passDimOrder(o,F)); }
function computeOrderCounts(orders){
  const total=orders.length; const byChannel={}; CHANNELS.forEach(c=>byChannel[c]=0);
  let net=0; const buyers=new Set();
  orders.forEach(o=>{ byChannel[o.customer_channel]=(byChannel[o.customer_channel]||0)+1; net+=(+o.net_sale||0); if(o.cust_key!=null) buyers.add(o.cust_key); });
  const organic=byChannel['Direct Walkin']||0, known=total-organic;
  return { total, byChannel, net, buyers:buyers.size, organic, known, aov:total?net/total:0, knownPct:pct(known,total), organicPct:pct(organic,total) };
}
function orderRollup(orders,keyFn){
  const m=new Map();
  orders.forEach(o=>{ const k=keyFn(o.order_date); if(!m.has(k)) m.set(k,[]); m.get(k).push(o); });
  return [...m.keys()].sort().map(k=>Object.assign({period:k},computeOrderCounts(m.get(k))));
}
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function monthLabel(k){ const p=k.split('-'); return MONTHS[+p[1]-1]+' '+p[0]; }
function monthEnd(k){ const s=parseYmd(k+'-01'); return new Date(s.getFullYear(),s.getMonth()+1,0); }
// days of month k actually covered by data running minD..maxD (first and last month can be partial)
function daysCovered(k,minD,maxD){ const s=parseYmd(k+'-01'), e=monthEnd(k); const a=minD&&parseYmd(minD)>s?parseYmd(minD):s, b=maxD&&parseYmd(maxD)<e?parseYmd(maxD):e; return Math.max(1,Math.round((b-a)/86400000)+1); }

/* ═══════════════════════════════════════════════════════════════════════
   CORE AGGREGATIONS
   ═══════════════════════════════════════════════════════════════════════ */
function computeCounts(items){
  const total=items.length; const byChannel={}; CHANNELS.forEach(c=>byChannel[c]=0);
  items.forEach(it=>{ byChannel[it.customer_channel]=(byChannel[it.customer_channel]||0)+1; });
  const organic=byChannel['Direct Walkin']||0, known=total-organic;
  const newV=items.filter(i=>i.customer_type==='New').length, repeatV=total-newV;
  // count people on cust_key (anonymous per-mobile id); the masked mobile keeps only 4 digits, so different people collide on it
  const pk=i=>i.cust_key!=null?i.cust_key:i.mobile_masked;
  const mobiles=new Set(items.map(pk)); const uniqueV=mobiles.size;
  const returningMobiles=new Set(items.filter(i=>i.lifetime_visits>1).map(pk)); const returningV=returningMobiles.size;
  return { total, byChannel, organic, known, newV, repeatV, uniqueV, returningV,
    organicPct:pct(organic,total), knownPct:pct(known,total),
    shopifyPct:pct(byChannel['Shopify']||0,total), webengagePct:pct(byChannel['WebEngage']||0,total),
    dealsPct:pct(byChannel['Zoho Deals']||0,total), leadsPct:pct(byChannel['Zoho Leads']||0,total) };
}
function periodRollup(items,keyFn){
  const m=new Map();
  items.forEach(it=>{ const k=keyFn(it.visit_date); if(!m.has(k)) m.set(k,[]); m.get(k).push(it); });
  const out=[...m.keys()].sort().map(k=>{ const c=computeCounts(m.get(k)); return Object.assign({period:k},c); });
  return out;
}
function dailyRollup(items){ return periodRollup(items,s=>s); }
function weeklyRollup(items){ return periodRollup(items,weekKey); }
function monthlyRollup(items){ return periodRollup(items,monthKey); }

function storeRollup(items){
  const m=new Map();
  items.forEach(it=>{ const k=it.store_name||'Unassigned'; if(!m.has(k)) m.set(k,{name:k,city:it.city,state:it.state,region:it.region,rows:[]}); m.get(k).rows.push(it); });
  return sortDesc([...m.values()].map(g=>{ const c=computeCounts(g.rows); return Object.assign({name:g.name,city:g.city||'Unknown',state:g.state||'Unknown',region:g.region||'Unknown'},c); }),'total');
}
function cityRollup(items,totalAll){
  const m=new Map();
  items.forEach(it=>{ const k=it.city||'Unknown (no store assigned)'; if(!m.has(k)) m.set(k,{name:k,state:it.state,region:it.region,rows:[]}); m.get(k).rows.push(it); });
  return sortDesc([...m.values()].map(g=>{ const c=computeCounts(g.rows); return Object.assign({name:g.name,state:g.state||'Unknown',region:g.region||'Unknown',contribution:pct(c.total,totalAll||c.total)},c); }),'total');
}
function geoRollup(items){
  const m=new Map(); // region -> state -> city -> store -> count
  items.forEach(it=>{
    const r=it.region||'Unknown', s=it.state||'Unknown', c=it.city||'Unknown', st=it.store_name||'Unassigned';
    if(!m.has(r)) m.set(r,new Map()); const R=m.get(r);
    if(!R.has(s)) R.set(s,new Map()); const S=R.get(s);
    if(!S.has(c)) S.set(c,new Map()); const C=S.get(c);
    C.set(st,(C.get(st)||0)+1);
  });
  return m;
}

/* ═══════════════════════════════════════════════════════════════════════
   CHART PRIMITIVES  (hand-rolled SVG, no CDN — per dataviz skill mark specs)
   ═══════════════════════════════════════════════════════════════════════ */
let C_INK='#f4f1ea',C_MUTED='#7d7a72',C_GRID='rgba(255,255,255,.06)';
function refreshThemeColors(){ const s=getComputedStyle(document.body); C_INK=s.getPropertyValue('--ink').trim(); C_MUTED=s.getPropertyValue('--muted').trim(); C_GRID=s.getPropertyValue('--grid').trim(); resolveChannelHex(); }
function sparkline(vals,color,h){ h=h||30; const w=120; color=color||'var(--gold)';
  if(!vals.length) return ''; const mn=Math.min(...vals,0),mx=Math.max(...vals,1); const rng=(mx-mn)||1;
  const pts=vals.map((v,i)=>[i/(Math.max(1,vals.length-1))*w, h-4-((v-mn)/rng)*(h-8)]);
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=line+` L${w} ${h} L0 ${h} Z`; const last=pts[pts.length-1]; const id='sg'+Math.floor(Math.random()*1e6);
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="height:${h}px">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".28"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#${id})"/><path d="${line}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="2.4" fill="${color}"/></svg>`;
}
function legendFor(series){ if(series.length<2) return ''; return `<div class="legend">`+series.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')+`</div>`; }
function linFit(vals){ const n=vals.length; if(n<2) return null; let sx=0,sy=0,sxx=0,sxy=0;
  vals.forEach((v,i)=>{ sx+=i; sy+=v; sxx+=i*i; sxy+=i*v; });
  const denom=(n*sxx-sx*sx); if(!denom) return null;
  const m=(n*sxy-sx*sy)/denom, b=(sy-m*sx)/n; return {m,b}; }
function lineArea(series,keys,opts){
  opts=opts||{}; const W=760,H=opts.height||230,P={t:16,r:14,b:34,l:44};
  const iw=W-P.l-P.r, ih=H-P.t-P.b;
  let mx=0; series.forEach(s=>s.data.forEach(v=>{ if(v>mx)mx=v; })); if(mx===0)mx=1; mx*=1.12;
  const nk=keys.length; const xf=i=>P.l+(nk<=1?iw/2:i/(nk-1)*iw); const yf=v=>P.t+ih-(v/mx)*ih;
  let g=''; for(let i=0;i<=3;i++){ const val=mx*i/3; const y=yf(val);
    g+=`<line x1="${P.l}" y1="${y}" x2="${W-P.r}" y2="${y}" stroke="${C_GRID}"/><text x="${P.l-8}" y="${y+3}" fill="${C_MUTED}" font-size="9.5" text-anchor="end">${fmtInt(val)}</text>`; }
  const lstep=Math.max(1,Math.ceil(nk/8));
  keys.forEach((k,i)=>{ if(i%lstep&&i!==nk-1)return; g+=`<text x="${xf(i)}" y="${H-10}" fill="${C_MUTED}" font-size="9" text-anchor="middle">${esc(shortKey(k))}</text>`; });
  let paths='', labels='';
  series.forEach((s,si)=>{ const col=s.color; const pts=s.data.map((v,i)=>[xf(i),yf(v)]);
    const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
    const single=series.length===1;
    if(single){ const id='la'+si+Math.floor(Math.random()*1e5);
      paths+=`<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".22"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
        <path d="${line} L${xf(nk-1)} ${P.t+ih} L${xf(0)} ${P.t+ih} Z" fill="url(#${id})"/>`; }
    paths+=`<path d="${line}" fill="none" stroke="${col}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>`;
    // trend line: linear best-fit overlay, dashed & neutral (never the series hue) so it never impersonates a second series — only drawn for a single-series chart to avoid clutter
    if(single && nk>=3){ const fit=linFit(s.data); if(fit){
      const y0=yf(fit.b), y1=yf(fit.m*(nk-1)+fit.b);
      paths+=`<line x1="${xf(0).toFixed(1)}" y1="${y0.toFixed(1)}" x2="${xf(nk-1).toFixed(1)}" y2="${y1.toFixed(1)}" stroke="${C_MUTED}" stroke-width="1.4" stroke-dasharray="4 3" stroke-linecap="round" data-tip="Trend line (linear best fit)"/>`;
    } }
    pts.forEach((p,i)=>{ paths+=`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="9" fill="transparent" data-tip="<b>${esc(keys[i])}</b><br>${esc(s.name)}: ${fmtInt(s.data[i])}"/><circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.6" fill="${col}"/>`; });
    // direct data label: always on the last (most-recent) point; also on the peak point when this is the only series (avoids label clutter with 5+ overlapping series)
    const lastI=pts.length-1, lastP=pts[lastI];
    const aboveLast = lastP[1] > P.t+10;
    labels+=`<text x="${lastP[0].toFixed(1)}" y="${(aboveLast?lastP[1]-8:lastP[1]+14).toFixed(1)}" fill="${C_INK}" font-size="10" font-weight="700" text-anchor="${lastI===0?'start':lastI===nk-1?'end':'middle'}">${fmtInt(s.data[lastI])}</text>`;
    if(single && nk>2){ let peakI=0; s.data.forEach((v,i)=>{ if(v>s.data[peakI]) peakI=i; });
      if(peakI!==lastI){ const pp=pts[peakI]; const above=pp[1]>P.t+10;
        labels+=`<text x="${pp[0].toFixed(1)}" y="${(above?pp[1]-8:pp[1]+14).toFixed(1)}" fill="${C_INK}" font-size="10" font-weight="700" text-anchor="middle">${fmtInt(s.data[peakI])}</text>`; }
    }
  });
  return `<div class="scroll-x"><svg class="chart" viewBox="0 0 ${W} ${H}" style="min-width:520px">${g}${paths}${labels}</svg></div>`+legendFor(series);
}
function shortKey(k){ if(/^\d{4}-\d{2}-\d{2}$/.test(k)) return k.slice(5); if(/^\d{4}-\d{2}$/.test(k)){ const p=k.split('-'); return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+p[1]-1]+" '"+p[0].slice(2); } return k; }
function bars(data,opts){ opts=opts||{}; const W=680,H=opts.height||220,P={t:14,r:12,b:38,l:42};
  const iw=W-P.l-P.r,ih=H-P.t-P.b; const mx=Math.max(1,...data.map(d=>Math.abs(d.value)));

  for(let i=0;i<=3;i++){ const y=P.t+ih-ih*i/3; g+=`<line x1="${P.l}" y1="${y}" x2="${W-P.r}" y2="${y}" stroke="${C_GRID}"/><text x="${P.l-7}" y="${y+3}" fill="${C_MUTED}" font-size="9.5" text-anchor="end">${fmtInt(mx*i/3)}</text>`; }
  data.forEach((d,i)=>{ const h=Math.abs(d.value)/mx*ih; const x=P.l+gap*i+(gap-bw)/2; const y=P.t+ih-h;
    g+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(1,h).toFixed(1)}" rx="4" fill="${d.color}" data-tip="<b>${esc(d.label)}</b><br>${fmtInt(d.value)} visits"/>`;
    g+=`<text x="${(x+bw/2).toFixed(1)}" y="${(y-6).toFixed(1)}" fill="${C_INK}" font-size="10" font-weight="600" text-anchor="middle">${fmtInt(d.value)}</text>`;
    g+=`<text x="${(x+bw/2).toFixed(1)}" y="${H-14}" fill="${C_MUTED}" font-size="10" text-anchor="middle">${esc(trunc(d.label,12))}</text>`; });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${g}</svg>`;
}
function donut(data,opts){ opts=opts||{}; const total=data.reduce((a,d)=>a+Math.abs(d.value),0)||1; const R=82,r=52,cx=96,cy=96;
  let a=-Math.PI/2,g='';

    const x1=cx+R*Math.cos(a),y1=cy+R*Math.sin(a),x2=cx+R*Math.cos(a2),y2=cy+R*Math.sin(a2);
    const xi2=cx+r*Math.cos(a2),yi2=cy+r*Math.sin(a2),xi1=cx+r*Math.cos(a),yi1=cy+r*Math.sin(a);

  return `<svg class="chart" viewBox="0 0 192 192" style="max-height:220px">${g}</svg>`+
    `<div class="legend">`+data.map(d=>`<span><i style="background:${d.color}"></i>${esc(d.label)} · ${fmtInt(d.value)} · ${pctStr(Math.abs(d.value)/total*100)}</span>`).join('')+`</div>`;

function hbars(data,opts){ opts=opts||{}; const mx=Math.max(1,...data.map(d=>Math.abs(d.value)));
  return `<div style="display:flex;flex-direction:column;gap:9px">`+data.map(d=>{ const w=Math.abs(d.value)/mx*100;
    return `<div style="display:grid;grid-template-columns:132px 1fr auto;gap:10px;align-items:center;font-size:12px">

 'kpi-mtd':{shows:'All store visits from the 1st of the month (of the most recent data day) through that day.',why:'Standard month-to-date volume tracking for management review.',formula:'COUNT(visits) WHERE visit_date BETWEEN month-start(max_visit_date) AND max_visit_date.',impact:'Falls short mid-month by design — compare against a prior full month, not a straight-line target.',actions:'Pair with the Daily Summary tab to see which days are driving or dragging the month.'},
 'kpi-total':{shows:'Every walk-in visit in the loaded dataset, across the full history available.',why:'The anchor number for all other percentages on this dashboard.',formula:'COUNT(all rows in items[]).',impact:'Not affected by the date-range filter (dimension filters like store/channel still apply) — always the true dataset size.',actions:'—'},
 'kpi-known':{shows:'Visits where the mobile number matched Shopify, WebEngage, Zoho Deals or Zoho Leads, in that priority order.',why:'A "known" customer can be retargeted, followed up, or has an existing CRM/commerce record.',formula:'COUNT(visits) WHERE customer_channel != "Direct Walkin", within the active filters.',impact:'Higher Known% means more of your walk-in traffic is addressable by marketing/CRM.',actions:'Compare Known% by store — a store far below the company average needs a mobile-capture process fix.'},
 'kpi-organic':{shows:'Visits where the mobile number did not match any of the 4 source systems.',why:'These are real customers your team cannot currently retarget, thank, or follow up with — a pure list-growth opportunity.',formula:'COUNT(visits) WHERE customer_channel = "Direct Walkin".',impact:'Every Direct Walkin visit is a missed CRM capture, not necessarily a "bad" customer.',actions:'Train front-of-store staff to capture a mobile number for every walk-in, even a browsing one.'},
 'kpi-organicpct':{shows:'Share of all visits that are Direct Walkin (unmatched).',why:'The single clearest "how much of our footfall is invisible to CRM" number.',formula:'Direct Walkin ÷ Total × 100.',impact:'A rising Direct Walkin% over time signals a growing capture gap, not necessarily falling marketing effectiveness.',actions:'Set a target Direct Walkin% ceiling per store and review monthly.'},
 'kpi-knownpct':{shows:'Share of all visits that are Known (matched to any source system).',why:'Inverse of Direct Walkin% — the addressable share of footfall.',formula:'Known ÷ Total × 100.',impact:'—',actions:'—'},
 'kpi-dealspct':{shows:'Share of visits whose mobile matched a Zoho Deal.',why:'Zoho Deals is priority #1 (client-requested order, set 2026-07-28) — checked before every other source, so it wins any overlapping match.',formula:'COUNT(customer_channel="Zoho Deals") ÷ Total × 100.',impact:'Highest-priority channel — its share is a direct read of active-deal-to-walk-in conversion.',actions:'—'},
 'kpi-leadspct':{shows:'Share of visits whose mobile matched a Zoho Lead, after Zoho Deals is checked first.',why:'Zoho Leads is priority #2.',formula:'COUNT(customer_channel="Zoho Leads") ÷ Total × 100.',impact:'—',actions:'Prioritize follow-up on these — pre-qualified leads who then walked into a store.'},
 'kpi-o2o':{shows:'Store visits attributed to EITHER Zoho Deals or Zoho Leads, combined into one number.',why:'These are the two CRM/sales-pipeline sources — a customer who was already an active deal or lead in Zoho, then walked into a store. "Online to Offline" is the standard name for this kind of pipeline-to-footfall conversion.',formula:'COUNT(customer_channel="Zoho Deals") + COUNT(customer_channel="Zoho Leads").',impact:'Shows how much store footfall your sales/CRM pipeline is directly generating, independent of the e-commerce (Shopify) or marketing-engagement (WebEngage) channels.',actions:'Track this alongside CRM pipeline volume to gauge in-store conversion of active deals/leads; a low number relative to open pipeline may indicate sales isn\'t driving store visits effectively.'},
 'kpi-shopifypct':{shows:'Share of visits whose mobile number matched a Shopify customer record, after Zoho Deals/Leads are checked first.',why:'Shopify is priority #3 — an online buyer who also visits a physical store.',formula:'COUNT(customer_channel="Shopify") ÷ Total × 100.',impact:'A high Shopify share suggests strong online-to-offline crossover.',actions:'Use store visit data to trigger post-visit online remarketing for these customers.'},
 'kpi-webengagepct':{shows:'Share of visits whose mobile number matched a WebEngage-tracked lead/session, the last check before falling to Direct Walkin.',why:'WebEngage is priority #4 (checked last of the 4 sources under the current order).',formula:'COUNT(customer_channel="WebEngage") ÷ Total × 100.',impact:'Shows how much footfall originates from marketing-engaged web visitors not already claimed by a higher-priority source.',actions:'—'},
 'kpi-newv':{shows:'Visit-rows that are each phone number\'s first-ever visit in this table.',why:'Top-of-funnel walk-in acquisition volume.',formula:'COUNT(visits WHERE visit_seq = 1).',impact:'—',actions:'Compare against Repeat to see the balance of new footfall vs returning footfall.'},
 'kpi-repeatv':{shows:'Visit-rows that are NOT each phone\'s first visit (i.e. a second, third, … visit).',why:'Indicates store loyalty / repeat footfall, scoped to store visits only — not full brand purchase history.',formula:'Total visits − New visits.',impact:'—',actions:'—'},
 'kpi-uniquev':{shows:'Distinct mobile numbers among the visits in scope.',why:'De-duplicated headcount — a person visiting 3 times still counts once here.',formula:'COUNT(DISTINCT mobile_masked).',impact:'—',actions:'—'},
 'kpi-returningv':{shows:'Distinct mobile numbers whose lifetime_visits (in this table) is greater than 1.',why:'Customer-level repeat-visit indicator — different from "Repeat visits" which counts visit-rows, not people.',formula:'COUNT(DISTINCT mobile_masked WHERE lifetime_visits > 1).',impact:'This is "repeat STORE VISIT" behaviour, not full lifetime CRM order history.',actions:'—'},
 'monthly-walkin':{shows:'Store walk-ins per month for the last 6 months, last 12 months or all months (buttons on the card), split by the channel that brought the customer (Zoho Deals, Zoho Leads, Shopify, WebEngage, Direct Walkin). The number on each point is that month\'s count.',why:'Shows which channels are growing or shrinking month after month. The date buttons at the top of the page do not cut this table.',formula:'GROUP BY month(visit_date), customer_channel. Avg / Day = walk-ins ÷ days of that month that have data. The current month is still running, so compare it on Avg / Day, not on the total.',impact:'A channel whose monthly count keeps falling is bringing fewer people into stores.',actions:'Store / city / channel filters do apply — pick a store to see its own monthly trend.'},
 'monthly-orders':{shows:'Store orders per month (last 6 months, last 12 months or all months — buttons on the card) and which channel each buyer came from. Orders = invoices in marketing_sale, STORE channel only, cancelled orders removed.',why:'Walk-ins show footfall; orders show which channel actually turns into a sale at the store.',formula:'One order = one customer (mobile) per day — several invoices of the same customer on the same day count as one order, with their net sale added up. The buyer mobile on the invoice is matched to Zoho Deals → Zoho Leads → Shopify → WebEngage in that order; no match (or no mobile) = Direct Walkin. Net Sale = sum of net_sale on the invoice lines.',impact:'Compare each channel\'s share of orders with its share of walk-ins — a channel with many walk-ins but few orders converts poorly.',actions:'Use the store filter to see a single store. The date-range buttons do not cut this table.'},
 'order-summary':{shows:'Every day in the selected period: how many store orders came in and which channel each buyer came from — the order version of the Daily Summary.',why:'Answers "today we got N orders — how many from Zoho Deals, Shopify, Direct Walkin…".',formula:'Same order rules as the monthly order table, cut to the selected dates. Total row = the whole period; Compare row = the comparison period you picked; Change % = Total vs Compare.',impact:'—',actions:'Use ⋮ to export, or the button below the table to download the order list itself.'},
 'daily-summary':{shows:'One row per calendar day: total visits, each channel\'s count, Direct Walkin count, Known% and Direct Walkin%.',why:'The day-by-day operating view management reviews each morning.',formula:'GROUP BY visit_date.',impact:'—',actions:'Sort any column; export to CSV/Excel for a daily standup.'},
 'store-analysis':{shows:'Every store (including the Unassigned bucket) ranked by visit volume, with Direct Walkin%/Known%, per-channel share, and New/Repeat split.',why:'Shows where footfall concentrates and which locations have the weakest CRM capture.',formula:'GROUP BY store_name.',impact:'A store with high visits but low Known% is generating traffic your CRM cannot see.',actions:'Prioritise mobile-capture training at the highest-volume, lowest-Known% stores.'},
 'city-analysis':{shows:'Visits grouped by the STORE\'s city (not the customer\'s home address — see the footnote), with Direct Walkin/Known counts and contribution to total visits.',why:'The only geography available in this data is store location; treat this as "where the footfall physically occurred", not "where customers live".',formula:'GROUP BY city (store\'s city).',impact:'—',actions:'Use alongside the Store Analysis tab, since city and store map closely (one city can have multiple stores).'},
 'geography':{shows:'A nested Region → State → City → Store breakdown of visit counts.',why:'A literal map is not buildable (no lat/long or pincode exists in this data) — this nested table is the honest substitute.',formula:'GROUP BY region, state, city, store_name in that nesting order.',impact:'—',actions:'—'},
 'channel-bar':{shows:'Total visits attributed to each of the 5 channels, in fixed priority order (Zoho Deals > Zoho Leads > Shopify > WebEngage > Direct Walkin).',why:'The headline "who brought the walk-in" view.',formula:'COUNT(visits) GROUP BY customer_channel.',impact:'Whichever channel is checked LAST among the 4 will show a smaller share than it would stand-alone, since higher-priority channels claim any overlapping phone number first — see the Data Coverage tab for the current priority order.',actions:'—'},
 'channel-donut':{shows:'Same channel totals as a share-of-whole view.',why:'Emphasises relative contribution over absolute count.',formula:'Channel count ÷ total visits.',impact:'—',actions:'—'},
 'channel-trend':{shows:'Visits per channel over time (daily / weekly / monthly), one line per channel.',why:'Shows whether a channel\'s contribution is rising, falling, or flat.',formula:'GROUP BY period, customer_channel.',impact:'The dataset spans under a year, so quarterly/yearly views will look sparse — that is real, not an error.',actions:'Use the Copilot\'s "which channels are declining" question for an automatic read of this chart.'},
 'organic-city':{shows:'Direct Walkin visit count and Direct Walkin% for each city (store location).',why:'Pinpoints where the CRM-capture gap is largest geographically.',formula:'Direct Walkin visits ÷ total visits, per city.',impact:'—',actions:'Direct marketing budget and front-desk training toward the highest-Direct Walkin cities.'},
 'organic-store':{shows:'Direct Walkin visit count and Direct Walkin% for each store.',why:'Store-level version of the same gap — more actionable than city level since a manager owns a store.',formula:'Direct Walkin visits ÷ total visits, per store.',impact:'—',actions:'—'},
 'organic-trend':{shows:'Direct Walkin visit count and Direct Walkin% over time.',why:'Shows whether the CRM-capture gap is widening or closing.',formula:'GROUP BY period; Direct Walkin ÷ total per period.',impact:'—',actions:'—'},
 'cust-newrepeat':{shows:'Split of all visits into New (first-ever) vs Repeat (later) visit-rows.',why:'Shows the balance between fresh footfall and returning footfall.',formula:'visit_seq=1 → New; else → Repeat.',impact:'—',actions:'—'},
 'cust-knownorganic':{shows:'Split of all visits into Known (any matched channel) vs Direct Walkin.',why:'The core "can we retarget this person" split.',formula:'customer_channel != "Direct Walkin" → Known; else → Direct Walkin.',impact:'—',actions:'—'},
 'cust-uniquereturn':{shows:'Distinct mobiles (Unique) vs the subset with lifetime_visits>1 (Returning).',why:'Customer-level (not visit-level) loyalty read.',formula:'Unique = distinct mobiles. Returning = distinct mobiles with lifetime_visits>1.',impact:'Framed as "repeat STORE VISIT", not "repeat brand customer" — see Data Coverage.',actions:'—'},
 'coverage-panel':{shows:'Every data-gap and assumption note from the reporting layer, verbatim.',why:'Honest-gates convention: document what cannot be computed rather than hide or fabricate it.',formula:'—',impact:'—',actions:'—'}
};
function infoIcon(slug,title){ if(!slug||!INFO[slug]) return ''; return `<i class="info-btn" data-info="${slug}" data-title="${esc(title||'')}" tabindex="0" role="button" aria-label="About this — press Enter">ⓘ</i>`; }
function infoPopHTML(slug,title){ const d=INFO[slug]; if(!d) return '';
  const S=(k,t)=> t?`<section><div class="k">${k}</div><div class="t">${t}</div></section>`:'';
  return `<h4>${esc(title||slug)}</h4><div class="ip-sub">What it shows · why · how it's calculated</div>`
    +S('What it shows',d.shows)+S('Why it matters',d.why)+S('How it is calculated',d.formula)+S('Business impact',d.impact)+S('Recommended action',d.actions); }
const POP=document.getElementById('infoPop'); let popPin=false, popT=null;
function placePop(btn){ const r=btn.getBoundingClientRect(); const pr=POP.getBoundingClientRect();
  let x=r.right-pr.width; x=Math.max(10,Math.min(x,innerWidth-pr.width-10));
  let y=r.bottom+8; if(y+pr.height>innerHeight-10) y=r.top-pr.height-8; y=Math.max(10,y);
  POP.style.left=x+'px'; POP.style.top=y+'px'; }
function openPop(btn){ document.querySelectorAll('.info-btn.active').forEach(x=>x.classList.remove('active')); btn.classList.add('active');
  POP.innerHTML=infoPopHTML(btn.getAttribute('data-info'),btn.getAttribute('data-title')); POP.classList.add('on'); placePop(btn); }
function closePop(){ POP.classList.remove('on'); popPin=false; document.querySelectorAll('.info-btn.active').forEach(x=>x.classList.remove('active')); }
document.addEventListener('mouseover',e=>{ const b=e.target.closest('.info-btn'); if(b){ clearTimeout(popT); if(!popPin) openPop(b); } });
document.addEventListener('mouseout',e=>{ const b=e.target.closest('.info-btn'); if(b&&!popPin){ popT=setTimeout(()=>{ if(!POP.matches(':hover')) closePop(); },200); } });
POP.addEventListener('mouseenter',()=>clearTimeout(popT));
POP.addEventListener('mouseleave',()=>{ if(!popPin) closePop(); });
document.addEventListener('click',e=>{ const b=e.target.closest('.info-btn'); if(b){ e.preventDefault(); e.stopPropagation(); popPin=true; openPop(b); } else if(!e.target.closest('#infoPop')) closePop(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closePop(); return; } if(e.key==='Enter'||e.key===' '){ const b=document.activeElement; if(b&&b.classList&&b.classList.contains('info-btn')){ e.preventDefault(); popPin=true; openPop(b); } } });

/* tooltip (hover layer for bar/donut/line marks) */
const TIP=document.getElementById('tip');
document.addEventListener('pointermove',e=>{ const t=e.target.closest('[data-tip]');
  if(t){ TIP.innerHTML=t.getAttribute('data-tip'); TIP.classList.add('on'); let x=e.clientX+14,y=e.clientY+14;
    const tw=TIP.offsetWidth,th=TIP.offsetHeight; if(x+tw>innerWidth-10)x=e.clientX-tw-14; if(y+th>innerHeight-10)y=e.clientY-th-14;
    TIP.style.left=x+'px'; TIP.style.top=y+'px'; } else if(!e.target.closest('.tip')) TIP.classList.remove('on'); });

/* ═══════════════════════════════════════════════════════════════════════
   CARD / SECTION BUILDERS
   ═══════════════════════════════════════════════════════════════════════ */
function card(title,body,opts){ opts=opts||{}; const slug=opts.info||''; return `<div class="card ${opts.cls||''}"><div class="pad">
  ${title?`<div class="ct"><h3>${esc(title)}</h3><div class="ct-r">${opts.hint?`<span class="hint">${opts.hint}</span>`:''}${(/<table|<svg/i.test(body))?`<button class="cmenu-btn" data-cmenu title="Export / options">⋮</button>`:''}${infoIcon(slug,title)}</div></div>`:''}
  ${body}</div></div>`; }
function secHead(eyebrow,title,sub){ return `<div class="sec-head"><div><div class="eyebrow">${esc(eyebrow)}</div><h2>${esc(title)}</h2>${sub?`<div class="sub">${sub}</div>`:''}</div></div>`; }
function deltaMeta(cur,prev){ const g=growth(cur,prev); const sign=g>0.5?1:g<-0.5?-1:0; return {g,sign,cls:sign>0?'up':sign<0?'down':'flat',arw:sign>0?'▲':sign<0?'▼':'▬'}; }
// for metrics that are ALREADY a percentage (organicPct, knownPct, …) — relative growth() would
// compute "growth of a growth rate" and blow up absurdly on a small prev value (e.g. 0.3%→45% reads
// as +14900%); the correct comparison is the plain percentage-point difference.
function deltaMetaPP(cur,prev){ const d=cur-prev; const sign=d>0.5?1:d<-0.5?-1:0; return {d,sign,cls:sign>0?'up':sign<0?'down':'flat',arw:sign>0?'▲':sign<0?'▼':'▬'}; }

/* ═══════════════════════════════════════════════════════════════════════
   AI INSIGHTS (rule-based, computed from real numbers, WHY + impact)
   ═══════════════════════════════════════════════════════════════════════ */
function generateInsights(){
  const all=STATE.items; const cov=STATE.coverage; const D=STATE.maxDate;
  const totalAll=computeCounts(all);
  const mrd=all.filter(i=>i.visit_date===D); const mrdC=computeCounts(mrd);
  const stores=storeRollup(all).filter(s=>s.name!=='Unassigned' && s.total>=15);
  const cities=cityRollup(all,totalAll.total).filter(c=>!/Unknown/.test(c.name));
  const win30={from:ymd(addDays(parseYmd(D),-29)),to:D}; const winPrev30=comparePeriod(win30);
  const cur30=computeCounts(itemsInWindow(win30,{})); const prev30=computeCounts(itemsInWindow(winPrev30,{}));
  const orgTrend=cur30.organicPct-prev30.organicPct; // percentage-point difference, NOT relative growth() — organicPct is already a %, so growth() on it would compute a "growth of a growth rate" and blow up absurdly on a small prev value
  const out=[];
  out.push(`<b>${pctStr(totalAll.organicPct)} of all ${fmtInt(totalAll.total)} recorded walk-ins</b> could not be matched to Shopify, WebEngage or Zoho — these ${fmtInt(totalAll.organic)} customers are real footfall your CRM cannot currently retarget, because no mobile-capture step exists at the point of visit.`);
  if(mrd.length){ const top=sortDesc(CHANNELS.map(c=>({c,v:mrdC.byChannel[c]||0})),'v')[0];
    out.push(`On the most recent recorded day (<b>${D}</b>, ${cov.data_freshness_lag_days||'a few'} days behind live), <b>${esc(top.c)}</b> brought the most walk-ins (${fmtInt(top.v)} of ${fmtInt(mrdC.total)}) — treat this as the reference "yesterday" since the raw table itself lags real time.`); }
  { const nonOrganic=CHANNELS.filter(c=>c!=='Direct Walkin').map(c=>({c,pct:pct(totalAll.byChannel[c]||0,totalAll.total)}));
    const lowest=sortAsc(nonOrganic,'pct')[0];
    if(lowest && lowest.pct<3){ out.push(`<b>${esc(lowest.c)} contributes only ${pctStr(lowest.pct)} of final attribution</b> — not necessarily a data problem: it's the lowest-priority channel checked, so any phone number it shares with a higher-priority source (${CHANNELS.filter(c=>c!=='Direct Walkin'&&c!==lowest.c).join(', ')}) is claimed there first and never "wins" a match here.`); } }
  if(cities.length){ const topOrg=sortDesc(cities,'organic')[0];
    out.push(`<b>${esc(topOrg.name)}</b> has the highest Direct Walkin traffic among known cities (${fmtInt(topOrg.organic)} visits, ${pctStr(topOrg.organicPct)} of that city's footfall) — the single biggest opportunity to convert existing high-traffic footfall into an addressable CRM record.`); }
  if(stores.length){ const worst=sortAsc(stores,'knownPct')[0];
    out.push(`<b>${esc(worst.name)}</b> has the lowest CRM-identified share of any store with meaningful volume (${pctStr(worst.knownPct)} Known, ${fmtInt(worst.total)} visits) — this points to a front-desk capture gap, not necessarily weaker marketing reach.`); }
  out.push(`Direct Walkin share moved <b>${orgTrend>=0?'up':'down'} ${Math.abs(orgTrend).toFixed(1)}pp</b> over the last 30 days vs the prior 30 (${pctStr(cur30.organicPct)} vs ${pctStr(prev30.organicPct)}) — ${orgTrend>5?'a widening capture gap worth investigating store-by-store':orgTrend<-5?'a genuine improvement in CRM capture — worth identifying which store changed its process':'broadly stable'}.`);
  if(cov.visits_with_unassigned_store) out.push(`<b>${fmtInt(cov.visits_with_unassigned_store)} visits (${pctStr(pct(cov.visits_with_unassigned_store,totalAll.total))})</b> have no store_code at all ("Unassigned") — kept visible in every table below rather than hidden, but excluded from "top store" claims.`);
  out.push(`Data currently lags live by <b>${(cov.data_freshness_lag_days??'—')} day(s)</b> (latest visit on record: ${D}) — every "Yesterday/Today" figure on this dashboard is computed against that real latest date, not the calendar date.`);
  return out.slice(0,8);
}
function generateActions(){
  const all=STATE.items; const totalAll=computeCounts(all);
  const stores=storeRollup(all).filter(s=>s.name!=='Unassigned');
  const cities=cityRollup(all,totalAll.total).filter(c=>!/Unknown/.test(c.name));
  const win30={from:ymd(addDays(parseYmd(STATE.maxDate),-29)),to:STATE.maxDate}; const winPrev30=comparePeriod(win30);
  const cur30ByChan=computeCounts(itemsInWindow(win30,{})); const prev30ByChan=computeCounts(itemsInWindow(winPrev30,{}));
  const acts=[];
  const highOrgStores=sortDesc(stores.filter(s=>s.total>=15 && s.organicPct>totalAll.organicPct+8),'organicPct').slice(0,3);
  if(highOrgStores.length) acts.push({issue:`${highOrgStores.length} store(s) running well above the company Direct Walkin rate`,cause:`${highOrgStores.map(s=>esc(s.name)).join(', ')} show Direct Walkin% at least 8pp above the ${pctStr(totalAll.organicPct)} company average.`,
    rec:'Roll out a mandatory mobile-number capture script at checkout/greeting for these stores; tie it to a small incentive for front-desk staff.',impact:`Recovering half the gap to the company average would add ~${fmtInt(Math.round(highOrgStores.reduce((a,s)=>a+s.total*(s.organicPct-totalAll.organicPct)/100/2,0)))} newly-identified customers.`,owner:'Store Managers / Retail Ops',priority:'High'});
  const declining=CHANNELS.filter(c=>c!=='Direct Walkin').map(c=>({c,cur:pct(cur30ByChan.byChannel[c]||0,cur30ByChan.total),prev:pct(prev30ByChan.byChannel[c]||0,prev30ByChan.total)})).filter(x=>x.cur-x.prev<-2);
  if(declining.length) acts.push({issue:`${declining.map(d=>esc(d.c)).join(', ')} channel share declining`,cause:`Share fell ${declining.map(d=>pctStr(Math.abs(d.cur-d.prev))+' for '+esc(d.c)).join(', ')} over the last 30 days vs the prior 30.`,
    rec:'Review campaign spend/activity on the declining channel(s) for the same window — a drop in walk-in share often follows a drop in lead-gen activity 2-3 weeks earlier.',impact:'Early detection avoids a compounding footfall shortfall next month.',owner:'Marketing',priority:'Medium'});
  const topOrgCity=sortDesc(cities,'organic')[0];
  if(topOrgCity) acts.push({issue:`${esc(topOrgCity.name)} is the highest-opportunity city for marketing budget`,cause:`${fmtInt(topOrgCity.organic)} Direct Walkin visits (${pctStr(topOrgCity.organicPct)} of that city's footfall) are already walking in but not captured.`,
    rec:`Fund a local capture-and-retarget pilot (SMS/WhatsApp opt-in at greeting) in ${esc(topOrgCity.name)} before spending on new-city acquisition.`,impact:'Converts existing footfall into addressable customers at near-zero acquisition cost.',owner:'Marketing / Regional Manager',priority:'High'});
  const underStore=sortAsc(stores.filter(s=>s.total>=10),'total')[0];
  if(underStore) acts.push({issue:`${esc(underStore.name)} is the lowest-volume mapped store`,cause:`Only ${fmtInt(underStore.total)} visits recorded in the full dataset window.`,
    rec:'Audit footfall drivers (location, staffing, local marketing) for this store before the next budget cycle.',impact:'Low volume compounds — the earlier this is diagnosed, the cheaper the fix.',owner:'Regional Manager',priority:'Medium'});
  return acts;
}

/* ═══════════════════════════════════════════════════════════════════════
   AI COPILOT — deterministic, rule-based, grounded on the FULL dataset
   (not scoped to the filter drawer, so example CEO questions are robust)
   ═══════════════════════════════════════════════════════════════════════ */
const CP_PRESETS=['Which channel generated maximum walk-ins yesterday?','What percentage were Direct Walkin?','Which city has highest Direct Walkin traffic?','Which store has lowest CRM identified customers?','Which stores need marketing support?','Which channels are declining?','What should management do next?','Which city should receive more marketing budget?','Which store is underperforming?','Why did Direct Walkin traffic increase?'];
function localAnswer(q){
  q=(q||'').toLowerCase();
  const all=STATE.items; const totalAll=computeCounts(all); const D=STATE.maxDate;
  const mrd=all.filter(i=>i.visit_date===D); const mrdC=computeCounts(mrd);
  const stores=storeRollup(all); const storesMapped=stores.filter(s=>s.name!=='Unassigned');
  const cities=cityRollup(all,totalAll.total).filter(c=>!/Unknown/.test(c.name));
  const win30={from:ymd(addDays(parseYmd(D),-29)),to:D}; const winPrev30=comparePeriod(win30);
  const cur30=computeCounts(itemsInWindow(win30,{})); const prev30=computeCounts(itemsInWindow(winPrev30,{}));

  if(/gender|age|category|product|sales.?exec/.test(q)) return `That cut isn't available: no Gender, Age Group, Product Category, Purchase Status or Sales Executive field exists anywhere in the 5 source tables behind this dashboard (see the Data Coverage tab for the exact note). I can answer on channel, store, city, organic and new/repeat instead.`;

  if(/(channel|which).*(max|most|generat).*(walk|visit)|maximum walk/.test(q) && /(yesterday|today|recent)/.test(q) || (/channel/.test(q)&&/yesterday/.test(q))){
    const top=sortDesc(CHANNELS.map(c=>({c,v:mrdC.byChannel[c]||0})),'v')[0];
    return `On the most recent day recorded (<b class="k">${D}</b> — data lags live by ${STATE.coverage.data_freshness_lag_days||'a few'} day(s), so this is the honest "yesterday"), <b class="k">${esc(top.c)}</b> generated the most walk-ins with <b class="k">${fmtInt(top.v)}</b> of ${fmtInt(mrdC.total)} total visits that day.`;
  }
  if(/what.*(percent|%).*organic|organic.*(percent|%)/.test(q)){
    return `<b class="k">${pctStr(totalAll.organicPct)}</b> of all ${fmtInt(totalAll.total)} recorded visits are Direct Walkin (${fmtInt(totalAll.organic)} visits) — meaning their mobile number matched none of Shopify, WebEngage, Zoho Deals or Zoho Leads.`;
  }
  if(/city.*(highest|most|top).*organic|organic.*city/.test(q)){
    const top=sortDesc(cities,'organic')[0];
    return top? `<b class="k">${esc(top.name)}</b> has the highest Direct Walkin traffic: <b class="k">${fmtInt(top.organic)}</b> Direct Walkin visits, ${pctStr(top.organicPct)} of that city's footfall. (Note: "city" here is the store's location, not the customer's home address.)` : `No known-city data available.`;
  }
  if(/store.*(lowest|least).*(crm|identif|known)/.test(q)){
    const w=sortAsc(storesMapped.filter(s=>s.total>=5),'knownPct')[0];
    return w? `<b class="k">${esc(w.name)}</b> has the lowest CRM-identified (Known) share: only <b class="k">${pctStr(w.knownPct)}</b> of its ${fmtInt(w.total)} visits matched a known channel — ${fmtInt(w.organic)} are Direct Walkin.` : `Not enough store data.`;
  }
  if(/(store|which stores).*(marketing support|need.*support|support)/.test(q)){
    const w=sortDesc(storesMapped.filter(s=>s.total>=15 && s.organicPct>totalAll.organicPct+8),'organicPct').slice(0,3);
    return w.length? `Stores needing marketing/CRM-capture support (Direct Walkin% well above the ${pctStr(totalAll.organicPct)} company average): ${w.map(s=>`<b class="k">${esc(s.name)}</b> (${pctStr(s.organicPct)} Direct Walkin)`).join(', ')}.` : `No store is significantly above the company Direct Walkin average right now.`;
  }
  if(/channel.*declin|declining channel/.test(q)){
    const dec=CHANNELS.filter(c=>c!=='Direct Walkin').map(c=>({c,cur:pct(cur30.byChannel[c]||0,cur30.total),prev:pct(prev30.byChannel[c]||0,prev30.total)})).filter(x=>x.cur-x.prev<-1);
    return dec.length? `Declining over the last 30 days vs the prior 30: ${dec.map(d=>`<b class="k">${esc(d.c)}</b> (${pctStr(d.prev)}→${pctStr(d.cur)})`).join(', ')}.` : `No channel shows a meaningful decline (>1pp) over the last 30 days vs the prior 30.`;
  }
  if(/what should management do|next step|recommend/.test(q)){
    const acts=generateActions().slice(0,3);
    return acts.length? `Top recommended actions: `+acts.map((a,i)=>`(${i+1}) ${esc(a.rec)}`).join(' ') : `No urgent rule-based actions triggered right now.`;
  }
  if(/city.*(marketing budget|budget)|budget.*city/.test(q)){
    const top=sortDesc(cities,'organic')[0];
    return top? `<b class="k">${esc(top.name)}</b> should get first priority for marketing budget: it already has ${fmtInt(top.organic)} Direct Walkin (unretargeted) visits — converting existing footfall is cheaper than acquiring new footfall elsewhere.` : `No city data available.`;
  }
  if(/store.*underperform|underperforming store/.test(q)){
    const w=sortAsc(storesMapped.filter(s=>s.total>=10),'total')[0];
    return w? `<b class="k">${esc(w.name)}</b> is the lowest-volume mapped store with only <b class="k">${fmtInt(w.total)}</b> visits in the full dataset — worth a footfall-driver audit.` : `Not enough data to flag an underperforming store.`;
  }
  if(/why.*organic.*(increase|rising|grew|up|higher)/.test(q)){
    const g=cur30.organicPct-prev30.organicPct; // percentage-point difference, not relative growth() — organicPct is already a %
    const drivers=sortDesc(storesMapped.filter(s=>s.total>=10),'organic').slice(0,2);
    return `Direct Walkin share moved from <b class="k">${pctStr(prev30.organicPct)}</b> to <b class="k">${pctStr(cur30.organicPct)}</b> over the last 30 vs prior 30 days (${g>=0?'+':''}${g.toFixed(1)}pp). ${drivers.length?`The stores contributing the most Direct Walkin volume are ${drivers.map(s=>esc(s.name)).join(', ')} — check whether their front-desk capture process changed recently; the data can confirm the trend but not the root cause.`:''}`;
  }
  if(/(brief|summary|overview)/.test(q)) return generateInsights().slice(0,4).join(' ');
  return `I can answer on: channel attribution (which channel brought the most walk-ins), Direct Walkin % and trend, city/store Direct Walkin and Known rankings, stores needing marketing support, declining channels, and recommended management actions — all grounded on the full ${fmtInt(totalAll.total)}-visit dataset. Try one of the suggestions below, or ask in your own words.`;
}

function kpiWithSpark(label,cur,prev,fmt,rollup,key,slug,isPP){

// head: [{l:label, c:optional channel colour}]; foot: [{cells, bold, shade}]
function sumTable(id,head,rows,foot){
  const th=head.map((h,i)=>`<th class="${i>0?'num':''}">${h.c?`<i class="dot" style="background:${h.c};margin-right:5px"></i>`:''}${esc(h.l)}</th>`).join('');
  const td=(r,b)=>r.map((v,i)=>`<td class="${i>0?'num':''}" style="white-space:nowrap">${b?'<b>'+v+'</b>':v}</td>`).join('');
  const tf=(foot||[]).map(f=>`<tr${f.shade?' style="background:var(--surface-2)"':''}>${td(f.cells,f.bold)}</tr>`).join('');
  return `<table class="dt" id="${id}"><thead><tr>${th}</tr></thead><tbody>${rows.map(r=>`<tr>${td(r)}</tr>`).join('')}</tbody>${tf?`<tfoot>${tf}</tfoot>`:''}</table>`;
}
function chHead(){ return CHANNELS.map(c=>({l:c,c:CHANNEL_HEX[c]})); }
function chgCell(a,b){ const c=chg(a,b); return `<span class="delta ${c.cls}">${c.t}</span>`; }
function chgPPCell(a,b){ const c=chgPP(a,b); return `<span class="delta ${c.cls}">${c.t}</span>`; }
function momCell(cur,prev,running){ if(running) return '<span class="pill warn">month running</span>'; if(prev==null) return '—'; return chgCell(cur,prev); }
function runningNote(k,maxD){ return `<div class="gate-note" style="margin-top:10px">* ${esc(monthLabel(k))} is still running (data to ${esc(maxD)}) — compare it with earlier months on <b>Avg / Day</b>, not on the total.</div>`; }
// month window shared by Table 1 and Table 2: last 6 / last 12 / all months, continuous (a month with no rows shows 0)
const MONTH_WINS=[['6','Last 6 months'],['12','Last 12 months'],['all','All months']];
function monthSeq(fromK,toK){ const out=[]; let [y,m]=fromK.split('-').map(Number); const [ty,tm]=toK.split('-').map(Number);
  while(y<ty||(y===ty&&m<=tm)){ out.push(y+'-'+String(m).padStart(2,'0')); if(++m>12){ m=1; y++; } } return out; }
function monthWindowKeys(minD,maxD){ const all=monthSeq(minD.slice(0,7),maxD.slice(0,7)); return STATE.monthWin==='all'?all:all.slice(-(+STATE.monthWin||6)); }
function monthWinLabel(){ const w=MONTH_WINS.find(x=>x[0]===STATE.monthWin); return w?w[1]:'Last 6 months'; }
function monthWinBar(){ return `<div class="pseg no-print" style="margin-bottom:14px">${MONTH_WINS.map(w=>`<button class="pbtn ${STATE.monthWin===w[0]?'on':''}" data-mwin="${w[0]}">${esc(w[1])}</button>`).join('')}</div>`; }
function niceStep(raw){ const p=Math.pow(10,Math.floor(Math.log10(raw))), n=raw/p; return Math.max(1,(n<=1?1:n<=2?2:(n<=2.5&&p>=10)?2.5:n<=5?5:10)*p); }
// monthly trend: one line per series, the value printed on every point (labels in a column are pushed apart so they never overlap)
function monthTrendChart(series,keys){
  const nk=keys.length, W=Math.max(620,nk*92), H=340, P={t:28,r:24,b:40,l:56}, pad=30;
  const iw=W-P.l-P.r-2*pad, ih=H-P.t-P.b;
  let mx=0; series.forEach(s=>s.data.forEach(v=>{ if(v>mx) mx=v; }));
  const step=niceStep(Math.max(1,mx*1.1)/5), top=Math.max(step,Math.ceil(mx*1.1/step)*step);
  const xf=i=>P.l+pad+(nk<=1?iw/2:i/(nk-1)*iw), yf=v=>P.t+ih-(v/top)*ih;
  let g='';
  for(let v=0; v<=top+step/2; v+=step){ const y=yf(v).toFixed(1);
    g+=`<line x1="${P.l}" y1="${y}" x2="${W-P.r}" y2="${y}" stroke="${C_GRID}"/><text x="${P.l-10}" y="${(+y+3.5).toFixed(1)}" fill="${C_MUTED}" font-size="11" text-anchor="end">${fmtInt(v)}</text>`; }
  keys.forEach((k,i)=>{ g+=`<text x="${xf(i).toFixed(1)}" y="${H-14}" fill="${C_MUTED}" font-size="11.5" text-anchor="middle">${esc(shortKey(k))}</text>`; });
  let paths='', labels='';
  series.forEach(s=>{ const pts=s.data.map((v,i)=>[xf(i),yf(v)]);
    paths+=`<path d="${pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ')}" fill="none" stroke="${s.color}" stroke-width="${s.w||2.2}" stroke-linecap="round" stroke-linejoin="round"/>`;
    pts.forEach((p,i)=>{ paths+=`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="10" fill="transparent" data-tip="<b>${esc(monthLabel(keys[i]))}</b><br>${esc(s.name)}: ${fmtInt(s.data[i])}"/><circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="${s.color}"/>`; }); });
  for(let i=0;i<nk;i++){
    const L=series.map(s=>({v:s.data[i],y:yf(s.data[i])-8,c:s.color})).filter(l=>l.v>0).sort((a,b)=>a.y-b.y);
    for(let j=1;j<L.length;j++) if(L[j].y-L[j-1].y<13) L[j].y=L[j-1].y+13;
    const over=L.length?L[L.length-1].y-(P.t+ih-3):0; if(over>0) L.forEach(l=>{ l.y-=over; });
    L.forEach(l=>{ labels+=`<text x="${xf(i).toFixed(1)}" y="${l.y.toFixed(1)}" fill="${l.c}" font-size="11" font-weight="700" text-anchor="middle" stroke="var(--surface)" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke">${fmtInt(l.v)}</text>`; });
  }
  return `<div class="scroll-x"><svg class="chart" viewBox="0 0 ${W} ${H}" style="min-width:${Math.min(W,760)}px">${g}${paths}${labels}</svg></div>`;
}
// line picker (multi-select) per chart: STATE.lineSel[chartId] = names of the lines shown; null = all lines.
// From "all", the first click shows only that line; further clicks add / remove lines to compare.
function lineChips(chartId,series){ const sel=STATE.lineSel[chartId], all=!sel;
  const chip=s=>{ const on=all||sel.includes(s.name);
    return `<button class="lchip ${on?'':'off'}" data-line="${esc(s.name)}" data-chart="${chartId}" title="${all?'Show only this line':on?'Hide this line':'Add this line'}"><i style="background:${on?s.color:'transparent'};border-color:${s.color}"></i>${esc(s.name)}</button>`; };
  return `<div class="lsel no-print"><span class="lsel-l">Show lines</span>${series.map(chip).join('')}<button class="lchip lall" data-line-all="${chartId}" ${all?'disabled':''}>Show all</button>`
    + `<span class="lsel-h">${all?'Click a line to see only it, then click more lines to compare':sel.length+' of '+series.length+' lines shown'}</span></div>`; }
function trendLines(rows,totalName,chartId){
  const series=[{name:totalName,color:'var(--gold)',w:3,data:rows.map(r=>r.total)}].concat(CHANNELS.map(c=>({name:c,color:CHANNEL_HEX[c],data:rows.map(r=>r.byChannel[c]||0)})));
  const sel=STATE.lineSel[chartId], shown=sel?series.filter(s=>sel.includes(s.name)):series;
  return lineChips(chartId,series)+monthTrendChart(shown.length?shown:series,rows.map(r=>r.period)); }
function toggleLine(chartId,name,allNames){ const cur=STATE.lineSel[chartId];
  if(!cur){ STATE.lineSel[chartId]=[name]; return; }
  const next=cur.includes(name)?cur.filter(n=>n!==name):allNames.filter(n=>n===name||cur.includes(n));
  STATE.lineSel[chartId]=(!next.length||next.length===allNames.length)?null:next; } // none or every line picked = show all
const pctOr=(x,total)=>total?pctStr(x):'—';

function monthlyWalkinSection(F){

  const prevK=monthSeq(minD.slice(0,7),keys[0]).slice(-2)[0], prevOut=prevK!==keys[0]?itemsAllDates(F).filter(i=>monthKey(i.visit_date)===prevK).length:null;

      ...CHANNELS.map(c=>fmtInt(r.byChannel[c]||0)),pctOr(r.knownPct,r.total),pctOr(r.organicPct,r.total),momCell(r.total,prev,run)]; });
  const T=computeCounts(items), winDays=keys.reduce((a,k)=>a+daysCovered(k,minD,maxD),0);

      + (isRunningMonth(last,maxD)?runningNote(last,maxD):''),{info:'monthly-walkin',hint:keys.length+' months · Total-row Unique Visitors counts each person once'});
}

function noOrdersCard(title,info){ return card(title,'<div class="empty">This data file has no order data yet — it appears after the next daily refresh (10:00 IST).</div>',{info}); }

function monthlyOrderSection(F){
  const oc=STATE.coverage.orders||{}, minD=oc.min_order_date, maxD=oc.max_order_date;
  if(!STATE.hasOrders||!minD) return secHead('Table 2','Monthly Order Trend','Store orders from marketing_sale, cancelled orders removed')+noOrdersCard('Monthly Order Trend — by Channel','monthly-orders');
  const keys=monthWindowKeys(minD,maxD);
  const sub=`Store orders from marketing_sale, cancelled orders removed · ${monthWinLabel()} (${monthLabel(keys[0])} → ${monthLabel(keys[keys.length-1])}) · store / city / channel filters apply · the date buttons above do not cut this table`;
  const os=ordersAllDates(F).filter(o=>keys.includes(monthKey(o.order_date)));
  const byK=new Map(orderRollup(os,monthKey).map(r=>[r.period,r]));
  const m=keys.map(k=>byK.get(k)||Object.assign({period:k},computeOrderCounts([])));
  const prevK=monthSeq(minD.slice(0,7),keys[0]).slice(-2)[0], prevOut=prevK!==keys[0]?ordersAllDates(F).filter(o=>monthKey(o.order_date)===prevK).length:null;
  const desc=[...m].reverse();
  const rows=desc.map((r,i)=>{ const run=isRunningMonth(r.period,maxD), days=daysCovered(r.period,minD,maxD), prev=i+1<desc.length?desc[i+1].total:prevOut;
    return [monthLabel(r.period)+(run?' *':''),fmtInt(r.total),fmtInt(r.buyers),(r.total/days).toFixed(1),lakh(r.net),r.total?fmtInt(r.aov):'—',
      ...CHANNELS.map(c=>fmtInt(r.byChannel[c]||0)),pctOr(r.knownPct,r.total),pctOr(r.organicPct,r.total),momCell(r.total,prev,run)]; });
  const T=computeOrderCounts(os), winDays=keys.reduce((a,k)=>a+daysCovered(k,minD,maxD),0);

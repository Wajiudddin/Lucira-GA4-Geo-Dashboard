function orderSummarySection(F,win){
  const sub=`${rangeLabel(F.range)} · ${win.from} → ${win.to} · store orders (marketing_sale, cancelled removed) · each buyer's channel is decided exactly like a walk-in`;
  if(!STATE.hasOrders) return secHead('Table 3','Order Source Summary',sub)+noOrdersCard('Order Source Summary','order-summary');
  const os=ordersInWindow(win,F), C=computeOrderCounts(os), cw=comparePeriod(win), Cc=computeOrderCounts(ordersInWindow(cw,F));
  const mini=(label,color,v,d)=>`<div class="mini"><div class="l">${color?`<i class="dot" style="background:${color};margin-right:5px"></i>`:''}${esc(label)}</div><div class="v">${fmtInt(v)}</div><div class="d">${d}</div></div>`;
  const minis=`<div class="stat-row">`
    + mini('Total Orders',null,C.total,`₹${lakh(C.net)} L net sale · ${chgCell(C.total,Cc.total)} vs ${fmtInt(Cc.total)}`)
    + CHANNELS.map(c=>mini(c,CHANNEL_HEX[c],C.byChannel[c]||0,`${pctStr(pct(C.byChannel[c]||0,C.total))} of orders · vs ${fmtInt(Cc.byChannel[c]||0)}`)).join('')
    + `</div>`;
  const line=`<div class="ord-line">Total <b>${fmtInt(C.total)}</b> order${C.total===1?'':'s'} came in — ${CHANNELS.map(c=>`<b>${fmtInt(C.byChannel[c]||0)}</b> from ${esc(c)}`).join(', ')}.</div>`;
  const rowOf=(label,d)=>[label,fmtInt(d.total),fmtInt(d.buyers),lakh(d.net),...CHANNELS.map(c=>fmtInt(d.byChannel[c]||0)),pctStr(d.knownPct),pctStr(d.organicPct)];
  const daily=[...orderRollup(os,s=>s)].reverse();
  const chRow=['Change %',chgCell(C.total,Cc.total),chgCell(C.buyers,Cc.buyers),chgCell(C.net,Cc.net),...CHANNELS.map(c=>chgCell(C.byChannel[c]||0,Cc.byChannel[c]||0)),chgPPCell(C.knownPct,Cc.knownPct),chgPPCell(C.organicPct,Cc.organicPct)];
  const head=[{l:'Date'},{l:'Orders'},{l:'Buyers'},{l:'Net Sale (₹ Lakh)'},...chHead(),{l:'Known %'},{l:'Direct Walkin %'}];
  const tbl=sumTable('tblOrderSummary',head,daily.map(d=>rowOf(d.period,d)),[
    {cells:rowOf('Total ('+winLabel(win)+')',C),bold:true,shade:true},{cells:rowOf('Compare ('+winLabel(cw)+')',Cc)},{cells:chRow,bold:true,shade:true}]);
  return secHead('Table 3','Order Source Summary',sub)
    + card('Order Source Summary — where the orders came from',minis+line
      + (daily.length?`<div class="scroll-x" style="margin-top:14px">${tbl}</div>`:'<div class="empty">No orders in this period for these filters.</div>')
      + `<div style="margin-top:12px"><button class="btn" data-act="expOrdersCSV">⬇ Download these orders (CSV)</button></div>`,
      {info:'order-summary',hint:daily.length+' day(s) with orders'});
}

VIEW.daily=function(){

  const rowOf=(label,d)=>{ const o2o=(d.byChannel['Zoho Deals']||0)+(d.byChannel['Zoho Leads']||0);
    return [label,fmtInt(d.total),fmtInt(d.uniqueV),fmtInt(d.newV),fmtInt(d.repeatV),fmtInt(d.returningV),fmtInt(d.byChannel['Shopify']||0),fmtInt(d.byChannel['WebEngage']||0),

  const rows=daily.map(d=>rowOf(d.period,d));

  const tot=rowOf('Total ('+winLabel(win)+')',Ct), cmpRow=rowOf('Compare ('+winLabel(cw)+')',Cc);

VIEW.cities=function(){
  const F=STATE.filters; const win=dateRange(F.range); const items=itemsInWindow(win,F);

  const body=cities.map((c,i)=>`<tr><td><span class="rank ${i<3?'r'+(i+1):''}">${i+1}</span></td><td>${esc(c.name)}</td><td>${esc(c.state)}</td><td>${esc(c.region)}</td>

    <td class="num">${pctStr(c.organicPct)}</td><td class="num">${pctStr(c.knownPct)}</td><td class="num">${pctStr(c.contribution)}</td></tr>`).join('');
  const tbl=`<table class="dt" id="tblCities"><thead><tr>${['#','City (store location)','State','Region','Visits','Known','Direct Walkin','Direct Walkin %','Known %','Contribution %'].map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table>`;
  const chart=bars(cities.map(c=>({label:c.name,value:c.total,color:'var(--gold)'})),{});

  const geo=geoRollup(items); let geoRows='';
  [...geo.keys()].sort().forEach(region=>{
    const R=geo.get(region); let regionTotal=0; R.forEach(S=>S.forEach(C2=>C2.forEach(v=>regionTotal+=v)));
    geoRows+=`<tr><td><b>${esc(region)}</b></td><td class="num"><b>${fmtInt(regionTotal)}</b></td></tr>`;
    [...R.keys()].sort().forEach(state=>{
      const S=R.get(state); let stateTotal=0; S.forEach(C2=>C2.forEach(v=>stateTotal+=v));
      geoRows+=`<tr><td class="indent1">${esc(state)}</td><td class="num">${fmtInt(stateTotal)}</td></tr>`;
      [...S.keys()].sort().forEach(city=>{
        const Cc=S.get(city); let cityTotal=0; Cc.forEach(v=>cityTotal+=v);
        geoRows+=`<tr><td class="indent2">${esc(city)}</td><td class="num">${fmtInt(cityTotal)}</td></tr>`;
        [...Cc.keys()].sort((a,b)=>Cc.get(b)-Cc.get(a)).forEach(store=>{
          geoRows+=`<tr><td class="indent3">${esc(store)}</td><td class="num">${fmtInt(Cc.get(store))}</td></tr>`;
        });
      });
    });
  });
  const geoTbl=`<table class="dt" id="tblGeo"><thead><tr><th>Region / State / City / Store</th><th class="num">Visits</th></tr></thead><tbody>${geoRows}</tbody></table>`;

  return secHead('Geography','City Analysis',`${rangeLabel(F.range)} · ${win.from} → ${win.to} · "city" = the STORE's location, not the customer's home address`)
    + card('Visits by City',chart,{info:'city-analysis'})

    + `<div style="margin-top:16px">${card('Geography — Region → State → City → Store',`<div class="scroll-x">${geoTbl}</div><p style="font-size:11px;color:var(--muted);margin-top:10px">No lat/long or pincode exists in this data, so a literal map is not buildable — this nested breakdown is the honest substitute.</p>`,{info:'geography'})}</div>`;

    + card('Contents',`<div class="doc-toc">${toc.map(t=>`<a href="#doc-${t[0]}">${esc(t[1])}</a>`).join('')}</div>`,{})

    + sec('what','1 · What this dashboard tells you',`
      <p>This dashboard answers two questions:</p>
      <ol><li><b>Every customer who walked into a Lucira store — which channel brought them?</b></li>
      <li><b>Every order placed in a Lucira store — which channel did the buyer come from?</b></li></ol>
      <p>The answer comes from the customer's <b>mobile number</b>. We look for that number in four systems — <b>Zoho Deals, Zoho Leads, Shopify and WebEngage</b>. If the number is in one of them, that system is the channel. If it is in none of them, the customer is a <b>Direct Walkin</b> (someone we had no record of before).</p>
      <p>Data on record: walk-ins from <b>${esc(cov.min_visit_date||'—')}</b> to <b>${esc(cov.max_visit_date||'—')}</b> (${n(cov.total_visits)} visits) and store orders from <b>${esc(oc.min_order_date||'—')}</b> to <b>${esc(oc.max_order_date||'—')}</b> (${n(oc.total_orders)} orders).</p>`)

    + sec('use','2 · How to use it',`

/* ═══════════════════════════════════════════════════════════════════════
   TABLE SORT (generic .dt header sort) + row-count guard
   ═══════════════════════════════════════════════════════════════════════ */
function sortDt(th){ const t=th.closest('table'); const idx=[...th.parentElement.children].indexOf(th);
  const tbody=t.querySelector('tbody'); const rows=[...tbody.querySelectorAll('tr')];
  const dir=th._dir=(th._dir===1?-1:1);
  rows.sort((a,b)=>{ const av=a.children[idx].textContent.trim(), bv=b.children[idx].textContent.trim();
    const an=parseFloat(av.replace(/[,%]/g,'')), bn=parseFloat(bv.replace(/[,%]/g,''));
    if(!isNaN(an)&&!isNaN(bn)) return (an-bn)*dir; return av.localeCompare(bv)*dir; });
  rows.forEach(r=>tbody.appendChild(r));
}

  document.getElementById('fab').onclick=()=>{ const c=document.getElementById('copilot'); c.classList.toggle('on'); if(c.classList.contains('on')&&!c.dataset.init){ initCopilot(); c.dataset.init=1; } };
  document.getElementById('cpClose').onclick=()=>document.getElementById('copilot').classList.remove('on');
  const send=()=>{ const inp=document.getElementById('cpInput'); const q=inp.value.trim(); if(!q) return; inp.value=''; cpAsk(q); };
  document.getElementById('cpSend').onclick=send;
  document.getElementById('cpInput').addEventListener('keydown',e=>{ if(e.key==='Enter') send(); });
  document.getElementById('cpSug').addEventListener('click',e=>{ const b=e.target.closest('[data-ask]'); if(b) cpAsk(b.getAttribute('data-ask')); });

  document.querySelectorAll('#tabs').forEach(n=>n.addEventListener('click',e=>{ const t=e.target.closest('[data-tab]'); if(t) setTab(t.getAttribute('data-tab')); }));

  document.getElementById('main').addEventListener('change',e=>{ const s=e.target.closest('[data-f]'); if(s){ STATE.filters[s.getAttribute('data-f')]=s.value; render(); return; }
    const c=e.target.closest('[data-cmp]'); if(c){ const F=STATE.filters; if(c.value==='custom'){ const cw=comparePeriod(dateRange(F.range)); F.cmpFrom=cw.from; F.cmpTo=cw.to; } F.cmp=c.value; render(); } });
  document.getElementById('main').addEventListener('click',e=>{
    const clr=e.target.closest('[data-clear]'); if(clr){ const k=clr.getAttribute('data-clear'); STATE.filters[k]= (k==='ctype'||k==='organic'||k==='store'||k==='city'||k==='state'||k==='region'||k==='channel')?'':STATE.filters[k]; render(); return; }
    const mw=e.target.closest('[data-mwin]'); if(mw){ STATE.monthWin=mw.getAttribute('data-mwin'); render(); return; }
    const ln=e.target.closest('[data-line]'); if(ln){ const id=ln.getAttribute('data-chart');
      const names=[...ln.parentElement.querySelectorAll('[data-line]')].map(b=>b.getAttribute('data-line'));
      toggleLine(id,ln.getAttribute('data-line'),names); render(); return; }
    const la=e.target.closest('[data-line-all]'); if(la){ STATE.lineSel[la.getAttribute('data-line-all')]=null; render(); return; }
    const pb=e.target.closest('[data-preset]'); if(pb){ const r=pb.getAttribute('data-preset'); const cur=dateRange(STATE.filters.range);
      if(r==='custom'&&STATE.filters.range!=='custom'){ STATE.filters.from=cur.from; STATE.filters.to=cur.to; }
      STATE.filters.range=r; render(); return; }
    const pa=e.target.closest('[data-preset-apply]'); if(pa){ const a=document.getElementById('pc_from').value, b=document.getElementById('pc_to').value;
      if(!a||!b){ toast('Pick both dates'); return; } STATE.filters.from=a<=b?a:b; STATE.filters.to=a<=b?b:a; render(); return; }
    if(e.target.closest('[data-freset]')){ resetFilters(); return; }
    if(e.target.closest('[data-cmp-apply]')){ const a=document.getElementById('cc_from').value, b=document.getElementById('cc_to').value; if(!a||!b){ toast('Pick both compare dates'); return; } STATE.filters.cmpFrom=a<=b?a:b; STATE.filters.cmpTo=a<=b?b:a; render(); return; }
    const cmb=e.target.closest('[data-cmenu]'); if(cmb){ e.stopPropagation(); openCardMenu(cmb); return; }
    const th=e.target.closest('table.dt th'); if(th && !th.hasAttribute('data-sortcol')){ sortDt(th); return; }
    const scol=e.target.closest('table.dt th[data-sortcol]'); if(scol){ const key=scol.getAttribute('data-sortcol'); TBL.sort===key?TBL.dir=-TBL.dir:(TBL.sort=key,TBL.dir=-1); render(); return; }
    const drow=e.target.closest('table.dt tbody tr'); if(drow){ drow.classList.toggle('row-selected'); return; }
    const act=e.target.closest('[data-act]'); if(act){ const a=act.getAttribute('data-act');
      if(a==='expFullCSV'){ const rows=itemsAllDates(STATE.filters); const head=['visit_id','visit_date','company_code','store_name','city','state','region','customer_first_name','mobile_masked','visit_source','customer_channel','customer_type','visit_seq','lifetime_visits'];
        const body=rows.map(i=>head.map(h=>i[h])); dl('lucira-walkin-detail.csv',csvOf([head,...body]),'text/csv'); }
      else if(a==='expFullXLS'){ const rows=itemsAllDates(STATE.filters); const head=['visit_id','visit_date','company_code','store_name','city','state','region','customer_first_name','mobile_masked','visit_source','customer_channel','customer_type','visit_seq','lifetime_visits'];
        const body=rows.map(i=>head.map(h=>i[h])); dl('lucira-walkin-detail.xls',xlsOf([head,...body]),'application/vnd.ms-excel'); }
      else if(a==='expOrdersCSV'){ const win=dateRange(STATE.filters.range); const rows=ordersInWindow(win,STATE.filters);
        const head=['order_date','document_no','invoices','company_code','store_name','city','customer_first_name','mobile_masked','customer_channel','fulfillment','line_items','pieces','net_sale','zoho_deals_flag','zoho_leads_flag','shopify_flag','webengage_flag'];
        const body=rows.map(o=>head.map(h=>o[h])); dl(`lucira-store-orders-${win.from}-to-${win.to}.csv`,csvOf([head,...body]),'text/csv'); }
      return; }
    const pv=e.target.closest('#btnPgPrev'); if(pv){ TBL.page=Math.max(0,TBL.page-1); render(); return; }
    const nx=e.target.closest('#btnPgNext'); if(nx){ TBL.page=TBL.page+1; render(); return; }
    const p2=e.target.closest('#btnPrint2'); if(p2){ window.print(); return; }
  });
  document.getElementById('main').addEventListener('input',e=>{ if(e.target.id==='tblSearch'){ TBL.q=e.target.value; TBL.page=0; const cur=e.target.selectionStart; render();
    const s=document.getElementById('tblSearch'); if(s){ s.focus(); s.setSelectionRange(cur,cur); } } });
  document.addEventListener('click',e=>{ const opt=e.target.closest('#cardMenu [data-cm]');
    if(opt){ const m=document.getElementById('cardMenu'); const nm=(m&&m.dataset.name)||'lucira-export'; const a=opt.getAttribute('data-cm');
      if(a==='xls') cardExportXLS(_menuCard,nm); else if(a==='csv') cardExportCSV(_menuCard,nm); else if(a==='svg') cardExportSVG(_menuCard,nm); closeCardMenu(); return; }
    if(!e.target.closest('#cardMenu')&&!e.target.closest('[data-cmenu]')) closeCardMenu(); });
  document.addEventListener('keydown',e=>{ if(e.target.matches('input,select,textarea')) return;
    if(e.key==='t'){ setTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark'); }
    else if(e.key==='Escape'){ document.getElementById('copilot').classList.remove('on'); }
    else if(/^[1-9]$/.test(e.key)){ const t=TABS[+e.key-1]; if(t) setTab(t.id); } });
}
async function boot(){
  try{ const t=localStorage.getItem('lucira_walkin_theme_v2'); if(t) document.documentElement.setAttribute('data-theme',t); }catch(e){}
  refreshThemeColors();
  await loadData();
  bindEvents(); render();
  document.getElementById('app').classList.add('ready');
  setTimeout(()=>{ const ld=document.getElementById('loader'); ld.classList.add('done'); setTimeout(()=>{ ld.style.display='none'; },750); },500);
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot); else boot();
</script>
</body>
</html>

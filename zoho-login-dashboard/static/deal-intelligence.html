<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zoho Deal Intelligence</title>
<style>
:root{
  --brand-brown:#8b6f56; --brand-brown-dark:#6e5744; --brand-mauve:#a05a64; --brand-mauve-light:#d9b8b4; --brand-cream:#fff8f0;
  --plane:#f7f3ee; --surface:#ffffff; --surface-2:#f8f5f1; --surface-3:#efe9e2;
  --ink:#2a2420; --ink-2:#5b524b; --muted:#8c827a; --border:#e6ded5; --grid:#eee8e1;
  /* category colours — validated (light surface): fixed everywhere */
  --c-total:#6e5744; --c-buyer:#A8455A; --c-nonbuyer:#9a9189; --c-sub:#3F72AF; --c-vis:#B07A1E; --c-ctwa:#2F8A68;
  --shadow:0 1px 2px rgba(60,40,20,.05),0 4px 14px rgba(60,40,20,.05);
  --radius:14px; --font:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --serif:Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --plane:#14110f; --surface:#1d1916; --surface-2:#25201c; --surface-3:#2f2924;
  --ink:#f3ede7; --ink-2:#c9bfb6; --muted:#968b82; --border:#3a332d; --grid:#2c2622;
  --c-total:#c9a98a; --c-buyer:#C4566C; --c-nonbuyer:#7d746c; --c-sub:#4F8AD0; --c-vis:#B58228; --c-ctwa:#3A9C77;
  --shadow:none;
}}
:root[data-theme="dark"]{
  --plane:#14110f; --surface:#1d1916; --surface-2:#25201c; --surface-3:#2f2924;
  --ink:#f3ede7; --ink-2:#c9bfb6; --muted:#968b82; --border:#3a332d; --grid:#2c2622;
  --c-total:#c9a98a; --c-buyer:#C4566C; --c-nonbuyer:#7d746c; --c-sub:#4F8AD0; --c-vis:#B58228; --c-ctwa:#3A9C77;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--plane);color:var(--ink);font-family:var(--font);font-size:13.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
.tnum,td.num,.kpi .val{font-variant-numeric:tabular-nums}
/* header */
header.app{background:linear-gradient(90deg,var(--brand-brown-dark),var(--brand-brown));color:#fff;padding:12px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo-chip{background:var(--brand-cream);border-radius:8px;padding:6px 10px;display:flex;align-items:center}
.logo-chip img{height:22px;display:block}
.mark{width:30px;height:30px;border-radius:50%/42%;background:var(--brand-cream);color:var(--brand-brown);display:grid;place-items:center;font-family:var(--serif);font-weight:700}
.titles h1{font-family:var(--serif);font-size:19px;font-weight:600;margin:0;letter-spacing:.2px}
.titles small{display:block;color:var(--brand-mauve-light);font-size:11.5px;letter-spacing:1.2px;text-transform:uppercase;margin-top:1px}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px}
.hdr-pill{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:20px;padding:5px 11px;white-space:nowrap}
.hdr-pill b{font-weight:600}
.hbtn{background:var(--brand-cream);color:var(--brand-brown-dark);border:0;border-radius:9px;padding:7px 13px;font-weight:600;font-size:12.5px;cursor:pointer;font-family:inherit}
.hbtn.ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.35)}
.hbtn:hover{filter:brightness(.96)}
/* filter bar */
.fbar{position:sticky;top:0;z-index:20;background:var(--plane);border-bottom:1px solid var(--border);padding:10px 24px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--ink-2);font:inherit;font-size:12.5px;font-weight:600;padding:6px 11px;border-radius:7px;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--brand-brown);color:#fff}
.seg button:hover:not(.on){background:var(--surface-3)}
.fbar input[type=date],.fbar select,.drawer select,.drawer input{background:var(--surface);color:var(--ink);border:1px solid var(--border);border-radius:8px;padding:6px 8px;font:inherit;font-size:12.5px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:3px 6px 3px 10px;font-size:12px;display:inline-flex;gap:6px;align-items:center}
.chip b{font-weight:600;color:var(--ink-2)}
.chip button{border:0;background:var(--surface-3);color:var(--ink-2);border-radius:50%;width:18px;height:18px;cursor:pointer;line-height:1;font-size:12px}
.btn{background:var(--surface);color:var(--ink);border:1px solid var(--border);border-radius:9px;padding:6px 12px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer}
.btn:hover{background:var(--surface-3)}
.btn.pri{background:var(--brand-brown);color:#fff;border-color:var(--brand-brown)}
.btn.sm{padding:4px 9px;font-size:11.5px}
.spacer{flex:1}
/* tabs */
nav.tabs{display:flex;gap:4px;padding:12px 24px 0;border-bottom:1px solid var(--border);overflow-x:auto;background:var(--plane)}
nav.tabs a{padding:9px 14px;border-radius:10px 10px 0 0;color:var(--ink-2);font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap;border:1px solid transparent;border-bottom:0;display:flex;align-items:center;gap:7px}
nav.tabs a.on{background:var(--surface);color:var(--ink);border-color:var(--border);box-shadow:inset 0 3px 0 var(--brand-mauve)}
nav.tabs a:hover:not(.on){color:var(--ink)}
.sw{width:9px;height:9px;border-radius:3px;display:inline-block;flex:0 0 9px}
main{padding:18px 24px 60px;max-width:1600px}
.h2{font-family:var(--serif);font-size:18px;font-weight:600;margin:4px 0 2px}
.sub{color:var(--muted);font-size:12.5px;margin-bottom:14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:2fr 1fr}
@media(max-width:1000px){.g2,.g3{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);min-width:0;margin-bottom:14px}
.grid>.card{margin-bottom:0}
.card h3{font-size:13.5px;font-weight:700;margin:0 0 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .rt{margin-left:auto;display:flex;gap:6px;align-items:center;font-weight:500}
.card h3 .hint{font-weight:500;color:var(--muted);font-size:11.5px}
/* KPI cards */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:14px}
@media(max-width:1200px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:620px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px 13px;box-shadow:var(--shadow);position:relative;overflow:hidden;cursor:default}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--kc)}
.kpi .lbl{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.6px;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.kpi .val{font-size:28px;font-weight:700;margin-top:6px;letter-spacing:-.6px;font-family:var(--serif)}
.kpi .row{display:flex;align-items:baseline;gap:8px;margin-top:2px;font-size:12px;color:var(--ink-2);flex-wrap:wrap}
.kpi .pct{font-weight:700;color:var(--ink)}
.delta{font-size:11.5px;font-weight:600;color:var(--muted)}
.delta.up::before{content:"▲ "} .delta.down::before{content:"▼ "}
/* tables */
.tbar{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.tbar input[type=search]{background:var(--surface-2);color:var(--ink);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font:inherit;font-size:12.5px;min-width:220px}
.tbar .cnt{color:var(--muted);font-size:12px}
.tbl-wrap{max-height:560px;overflow:auto;border:1px solid var(--border);border-radius:10px}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px}
th{text-align:left;color:var(--muted);font-weight:700;font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;padding:8px 10px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface-2);cursor:pointer;white-space:nowrap;user-select:none;z-index:1}
th:hover{color:var(--ink)}
th .ar{font-size:9px;margin-left:3px}
th.num,td.num{text-align:right}
td{padding:7px 10px;border-bottom:1px solid var(--grid);white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}
tbody tr:hover td{background:var(--surface-2)}
tr.click td{cursor:pointer}
tr.sel td{background:color-mix(in srgb,var(--brand-mauve) 10%,transparent)}
tr.tot td{font-weight:700;background:var(--surface-2);border-top:1px solid var(--border)}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:8px;font-size:12px;color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:11px;font-size:11px;font-weight:600;border:1px solid var(--border);background:var(--surface-2);color:var(--ink-2)}
.tag .sw{width:7px;height:7px;border-radius:2px}
.muted{color:var(--muted)}
.mini{display:inline-block;height:6px;border-radius:3px;background:var(--c-buyer);vertical-align:middle;margin-left:6px;opacity:.85}
/* charts */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;overflow:visible}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--font)}
.chart .gl{stroke:var(--grid);stroke-width:1}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-bottom:8px}
.legend span{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.legend span.off{opacity:.35}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--border);box-shadow:0 6px 20px rgba(0,0,0,.14);border-radius:9px;padding:8px 10px;font-size:12px;z-index:30;min-width:150px;display:none;color:var(--ink)}
.tip .tt{font-weight:700;margin-bottom:4px}
.tip .tr{display:flex;gap:8px;align-items:center;justify-content:space-between}
.tip .tr span:first-child{display:flex;align-items:center;gap:6px;color:var(--ink-2)}
/* notes & docs */
.note{background:var(--surface-2);border:1px solid var(--border);border-left:4px solid var(--brand-mauve);border-radius:10px;padding:10px 13px;font-size:12.5px;color:var(--ink-2);margin-bottom:14px}
.note b{color:var(--ink)}
.doc h4{font-family:var(--serif);font-size:15px;margin:18px 0 6px}
.doc p,.doc li{color:var(--ink-2);font-size:13px;max-width:900px}
.doc code{background:var(--surface-3);padding:1px 5px;border-radius:4px;font-size:12px}
.doc pre{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:12px;overflow:auto;max-width:900px}
.seg.small button{padding:4px 9px;font-size:11.5px}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(20,14,10,.35);z-index:40;display:none}
.drawer{position:fixed;top:0;right:0;bottom:0;width:380px;max-width:100%;background:var(--surface);border-left:1px solid var(--border);z-index:41;transform:translateX(100%);transition:transform .2s ease;display:flex;flex-direction:column}
.drawer.open{transform:none} .scrim.open{display:block}
.drawer .dh{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.drawer .dh h3{margin:0;font-family:var(--serif);font-size:16px}
.drawer .db{padding:12px 18px;overflow:auto;flex:1}
.drawer .df{padding:12px 18px;border-top:1px solid var(--border);display:flex;gap:8px}
.fg{margin-bottom:14px}
.fg label.t{display:block;font-size:10.5px;color:var(--muted);font-weight:700;letter-spacing:.5px;text-transform:uppercase;margin-bottom:5px}
.ms{border:1px solid var(--border);border-radius:8px;max-height:150px;overflow:auto;padding:4px 6px;background:var(--surface-2)}
.ms label{display:flex;gap:7px;align-items:center;font-size:12.5px;padding:2px 2px;cursor:pointer}
.ms label .n{margin-left:auto;color:var(--muted);font-size:11px}
.ms input[type=search]{width:100%;margin-bottom:4px}
.loading{padding:60px;text-align:center;color:var(--muted)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--surface-3);border-top-color:var(--brand-mauve);border-radius:50%;animation:sp .7s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
@media(max-width:700px){header.app,.fbar,main,nav.tabs{padding-left:16px;padding-right:16px}}
</style>
</head>
<body>
<header class="app">
  <div class="logo-chip"><img src="https://luciraonline.myshopify.com/cdn/shop/files/LJ_Logo_Pink.svg" alt="Lucira Jewelry" onerror="this.outerHTML='&lt;div class=&quot;mark&quot;&gt;L&lt;/div&gt;'"></div>
  <div class="titles"><h1>Zoho Deal Intelligence</h1><small>Buyer • Subscriber • Visitor • CTWA Analysis</small></div>
  <div class="hdr-right">
    <span class="hdr-pill" id="hdrRange">—</span>
    <span class="hdr-pill" id="hdrFresh">Loading…</span>
    <button class="hbtn ghost" id="btnTheme" title="Toggle light / dark">◐</button>
    <button class="hbtn ghost" id="btnReload" title="Reload data">↻ Refresh</button>
    <button class="hbtn" id="btnFilters">⚲ Filters <span id="fCount"></span></button>
  </div>
</header>

<div class="fbar">
  <div class="seg" id="presetSeg"></div>
  <span id="customBox" style="display:none"><input type="date" id="dFrom"> – <input type="date" id="dTo"></span>
  <div class="chips" id="chips"></div>
  <span class="spacer"></span>
</div>

<nav class="tabs" id="tabs"></nav>
<main id="main"><div class="loading"><span class="spin"></span>Loading Zoho deals…</div></main>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Advanced filters">
  <div class="dh"><h3>Advanced filters</h3><span class="spacer"></span><button class="btn sm" id="dClose">✕</button></div>
  <div class="db" id="drawerBody"></div>
  <div class="df"><button class="btn" id="dClear">Clear all</button><span class="spacer"></span><button class="btn pri" id="dApply">Apply</button></div>
</aside>
<div class="tip" id="tip"></div>

<script src="/static/di-core.js"></script>
<script src="/static/di-views.js"></script>
</body>
</html>

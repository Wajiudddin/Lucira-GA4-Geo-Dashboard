<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sales Analytics</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="sales-analytics-style.css" />
<script src="theme.js"></script>
</head>
<body>
<div class="shell">
  <div id="scrim" class="scrim"></div>
  <aside class="side" id="side">
    <div class="brand"><span>Lucira</span><small>Sales Analytics</small></div>
    <nav id="nav">
      <button class="on" data-p="p1">1 · Overview &amp; Sales</button>
      <button data-p="p9">2 · Compare</button>
      <button data-p="p3">3 · Product Performance</button>
      <button data-p="p4">4 · Customer Analytics</button>
      <button data-p="p5">5 · Jewellery Analytics</button>
      <button data-p="p6">6 · Pricing</button>
      <button data-p="p7">7 · Geography &amp; Store</button>
      <button data-p="p10">8 · Logic</button>
    </nav>
    <div class="foot">Source: BigQuery<br><b>ds_imputed_reporting.marketing_sale</b><br>Grain: one row per sales line</div>
  </aside>
  <main>
    <header class="top">
      <div class="ttl"><button id="menuBtn" class="menu-btn" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="side"><span></span><span></span><span></span></button><div><h1 id="pageTitle">Sales Analytics</h1><p id="pageSub"></p></div></div>
      <div class="acts"><span id="updated" class="muted"></span><button id="themeToggle" class="btn sm" type="button"></button><button id="refreshBtn" class="btn" type="button">Refresh data</button></div>
    </header>
    <details class="filters" open>
      <summary>Global filters <span id="scope" class="scope-line"></span></summary>
      <div class="frow">
        <label class="tf"><span>From</span><input type="date" id="dateFrom"></label>
        <label class="tf"><span>To</span><input type="date" id="dateTo"></label>
        <div class="presets" id="presets"><button class="btn sm" type="button" data-p="today">Today</button><button class="btn sm" type="button" data-p="yesterday">Yesterday</button><button class="btn sm" type="button" data-p="month">This month</button><button class="btn sm" type="button" data-p="lastweek">Last week</button><button class="btn sm" type="button" data-p="lastmonth">Last month</button></div>
        <button id="resetBtn" class="btn sm" type="button">Reset all</button>
      </div>
      <div id="filterGrid" class="fgrid"></div>
      <p class="note">Filters apply to every page and chart except the Data Quality checks, which always describe the full table. Empty selection = all values.</p>
    </details>
    <div id="pageBody"><div class="card"><p class="empty">Loading sales data…</p></div></div>
  </main>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="sales-analytics-core.js"></script>
<script src="sales-analytics.js"></script>
</body>
</html>
